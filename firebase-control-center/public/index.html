<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoulKey｜Firebase 課程總覽</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#27334b;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}header{padding:36px max(24px,calc((100vw - 950px)/2)) 55px;background:linear-gradient(125deg,#253356,#485faa);color:white}header small{color:#f0ce80;letter-spacing:.17em;font-weight:bold}h1{font-size:clamp(29px,5vw,46px);margin:12px 0}header p{opacity:.85}main{max-width:1010px;margin:-24px auto 0;padding:0 18px}.panel{border:1px solid #e1e2e8;border-radius:20px;background:white;padding:24px;margin-bottom:16px;box-shadow:0 6px 22px #17275110}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.input,select{background:white;border:1px solid #bdc4d3;border-radius:12px;padding:12px;font:inherit;min-width:0}button,a.action{border:0;border-radius:12px;padding:12px 19px;background:#4259a0;color:white;font:inherit;font-weight:750;cursor:pointer;text-decoration:none;display:inline-block}.note{color:#747d90;font-size:13px;line-height:1.7}.stats{display:flex;gap:12px;margin:14px 0}.stat{flex:1;border-radius:13px;background:#eef0fa;padding:14px}.stat strong{display:block;font-size:28px;color:#40579e}.filters{display:flex;gap:12px;margin:14px 0}.filters>*{flex:1;min-width:0}article{display:grid;grid-template-columns:82px 1fr auto;gap:14px;align-items:start;padding:18px 0;border-bottom:1px solid #e9eaf0}.lesson{padding:11px 8px;border-radius:11px;background:#e9edf9;color:#394e94;font-weight:800;text-align:center}h3{margin:0 0 6px;font-size:18px}.meta{font-size:13px;color:#7b8393;line-height:1.8}footer{max-width:900px;margin:30px auto;text-align:center;color:#858c98;font-size:12px;line-height:1.8;padding:16px}#err{color:#a52929;min-height:20px}@media(max-width:620px){main{padding:0 12px}.panel{padding:18px}.stats{gap:5px}.stat{padding:10px}.stat strong{font-size:23px}.filters{flex-direction:column}article{grid-template-columns:67px 1fr;gap:10px}article a{grid-column:2;justify-self:start}}
</style></head><body>
<header><small>SOULKEY · FIREBASE CONTROL CENTER</small><h1>打開心靈的鎖匙<br>課程總覽</h1><p>獨立 Firebase 備援入口・課程資料加密保存</p></header>
<main><section class="panel" id="gate"><h2>輸入 Firebase 專用存取碼</h2><p class="note">這是新建立的備援入口，與原本 Apps Script Bridge Key 不同。</p><form id="form" class="row"><input class="input" type="password" autocomplete="off" id="pass" placeholder="Firebase 存取碼" required style="flex:1;min-width:180px"><button id="open">開啟課程總覽</button></form><p id="err" role="alert"></p><p class="note">目前是唯讀快照：不會修改 Google Sheet、Drive、翻譯稿或觸發 Kaggle。</p></section>
<section id="dashboard" class="panel" hidden><div class="row" style="justify-content:space-between"><h2 style="margin:0">課程任務</h2><button id="lock">鎖定</button></div><p class="note">來源：全球翻譯控制中心 Google Sheet（備援快照，非即時同步）</p>
<div class="stats"><div class="stat">總課程<strong id="total"></strong></div><div class="stat">期數<strong id="periods"></strong></div><div class="stat">符合條件<strong id="shown"></strong></div></div>
<div class="filters"><select id="period" aria-label="選擇期數"></select><input id="search" class="input" type="search" placeholder="搜尋課名、任務 ID、課程 UID"></div><div id="list"></div></section></main>
<footer>SoulKey · Firebase 第一階段｜唯讀控制中心。所有正式課程檔案仍保存在原系統。</footer>
<script>
"use strict";
let data=null;
const el=id=>document.getElementById(id);
const escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(password){
 const r=await fetch("./data.enc.json",{cache:"no-store"});if(!r.ok)throw Error("無法讀取 Firebase 資料");
 const pack=await r.json();
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:decode(pack.salt),iterations:pack.iterations,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 try{
 const bytes=await crypto.subtle.decrypt({name:"AES-GCM",iv:decode(pack.iv),additionalData:new TextEncoder().encode("SoulKey-Firebase-Snapshot-v1")},key,decode(pack.ciphertext));
 const result=JSON.parse(new TextDecoder().decode(bytes));
 if(!Array.isArray(result.tasks))throw Error("格式錯誤");return result;
 }catch(e){throw Error("存取碼不正確或資料損毀");}
}
function draw(){
 const p=el("period").value,q=el("search").value.toLowerCase().trim();
 const rows=data.tasks.filter(x=>(!p||String(x.period)===p) &&
 (!q||[x.title,x.id,x.course_uid,x.youtubeUrl].some(y=>String(y||"").toLowerCase().includes(q))))
 .sort((a,b)=>b.period-a.period||Number(String(a.lesson).replace(/\D/g,""))-Number(String(b.lesson).replace(/\D/g,"")));
 el("shown").textContent=rows.length;
 el("list").innerHTML=rows.length?rows.map(x=>'<article><div class="lesson">'+escapeHTML(x.lesson)+'</div><div><h3>'+escapeHTML(x.title||x.id)+'</h3><div class="meta">'+escapeHTML(x.course_uid)+' · '+escapeHTML(x.id)+' · 第'+escapeHTML(x.period)+'期</div><div class="meta">中文：'+escapeHTML(x.zh||"—")+'　英文：'+escapeHTML(x.en||"—")+'　音檔：'+escapeHTML(x.tts||"—")+'</div></div>'+(x.youtubeUrl?'<a class="action" href="'+escapeHTML(x.youtubeUrl)+'" target="_blank" rel="noopener noreferrer">YouTube</a>':'')+'</article>').join(""):'<p class="note">沒有符合的課程</p>';
}
el("form").addEventListener("submit",async e=>{
 e.preventDefault();el("open").disabled=true;el("err").textContent="";
 try{
 data=await decrypt(el("pass").value);el("pass").value="";
 el("gate").hidden=true;el("dashboard").hidden=false;
 const ps=[...new Set(data.tasks.map(x=>x.period))].sort((a,b)=>b-a);
 el("total").textContent=data.tasks.length;el("periods").textContent=ps.length;
 el("period").innerHTML='<option value="">全部期數</option>'+ps.map(p=>'<option value="'+p+'">第'+p+'期</option>').join("");
 draw();
 }catch(err){el("err").textContent=err.message||"無法開啟";}finally{el("open").disabled=false;}
});
el("period").addEventListener("change",draw);el("search").addEventListener("input",draw);
el("lock").addEventListener("click",()=>{data=null;el("dashboard").hidden=true;el("gate").hidden=false;el("list").replaceChildren();});
</script></body></html>
