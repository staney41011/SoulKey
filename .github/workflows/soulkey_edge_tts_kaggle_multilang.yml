name: SoulKey Edge TTS Kaggle Multilang

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soulkey-edge-tts-kaggle-multilang
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: cwlmrcsir/soulkey-edge-natural-multilang

    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

      - name: Build Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/edge-tts-multilang"
          rm -rf "$DIR"
          mkdir -p "$DIR"

          cat > "$DIR/kernel-metadata.json" <<'JSON'
          {
            "id": "cwlmrcsir/soulkey-edge-natural-multilang",
            "title": "SoulKey Edge Natural Multilang",
            "code_file": "soulkey-edge-natural-multilang.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": false,
            "enable_tpu": false,
            "enable_internet": true,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          JSON

          cat > "$DIR/soulkey-edge-natural-multilang.py" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          repo = Path("/kaggle/working/SoulKey")
          if repo.exists():
              subprocess.run(["rm", "-rf", str(repo)], check=True)

          subprocess.run(
              ["git", "clone", "--depth", "1", "https://github.com/staney41011/SoulKey.git", str(repo)],
              check=True,
          )
          subprocess.run(
              [sys.executable, "-m", "pip", "install", "-q", "edge-tts==7.2.8"],
              check=True,
          )

          output_dir = Path("/kaggle/working/edge-natural-multilang-output")
          output_dir.mkdir(parents=True, exist_ok=True)

          subprocess.run(
              [
                  sys.executable,
                  str(repo / "translation-system" / "edge_tts_multilang_smoke.py"),
                  "--fixture",
                  str(repo / "translation-system" / "tests" / "fixtures" / "P256-L01-edge-natural-multilang.json"),
                  "--output-dir",
                  str(output_dir),
              ],
              check=True,
          )
          PY

      - name: Run Kaggle
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/edge-tts-multilang"
          kaggle kernels push -p "$DIR" -t 1800

          FINAL="UNKNOWN"
          for i in $(seq 1 180); do
            STATUS="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1 || true)"
            echo "$STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|completed'; then
              FINAL="COMPLETE"
              break
            fi
            if echo "$STATUS" | grep -Eqi 'error|failed|failure|cancel'; then
              FINAL="ERROR"
              break
            fi
            sleep 10
          done

          if [ "$FINAL" != "COMPLETE" ]; then
            kaggle kernels logs "$KAGGLE_KERNEL" || true
            exit 1
          fi

      - name: Download Kaggle output
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/edge-tts-multilang-output"
          mkdir -p "$OUT"
          kaggle kernels output "$KAGGLE_KERNEL" -p "$OUT"
          find "$OUT" -maxdepth 3 -type f -print

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: soulkey-edge-natural-multilang-v1
          path: ${{ runner.temp }}/edge-tts-multilang-output/**
          if-no-files-found: error
          retention-days: 7
