name: P259 Legacy Direct Kaggle Gemma4 Disabled

# The earlier standalone Kaggle kernels push does not provide SoulKey Bridge
# OAuth runtime credentials. Never launch P259 from this workflow.
# The supported production route is Studio -> Apps Script Bridge -> Kaggle Web Job
# with stage=multi, lang=central4, task_id=P259-L01.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explicitly reject obsolete secret-less Kaggle launch
        run: |
          echo "::error::Obsolete direct Kaggle Gemma4 workflow is disabled because it cannot obtain authorized Google OAuth runtime."
          echo "Use SoulKey Studio > 第259期四堂課補譯 to launch through the existing Apps Script Bridge."
          exit 1
