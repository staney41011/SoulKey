name: Retire GCP workers and preserve existing results
on:
  push:
    branches: [main]
    paths: ['.github/workflows/soulkey_retire_gcp_workers.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable obsolete schedulers and cancel their active coordinators
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in soulkey_translation_queue.yml soulkey_cc_queue.yml p259_translation_kickstart.yml soulkey_bridge_translation_capabilities_probe.yml; do
            gh api --method PUT "repos/$GH_REPO/actions/workflows/$workflow/disable"
            for status in in_progress queued waiting; do
              runs=$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?status=$status&per_page=100" --jq '.workflow_runs[].id')
              for run in $runs; do
                gh api --method POST "repos/$GH_REPO/actions/runs/$run/cancel" >/dev/null || true
                echo "RETIRED_GCP_COORDINATOR_CANCEL_REQUESTED run=$run"
              done
            done
            echo "GCP_SCHEDULER_DISABLED workflow=$workflow"
          done
          echo 'Existing Sheets, Drive files, private Kaggle outputs, and workflow history are preserved.'
