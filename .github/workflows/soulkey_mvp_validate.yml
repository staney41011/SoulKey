name: SoulKey MVP Validate

on:
  workflow_dispatch:
  push:
    paths:
      - "translation-system/**"
      - "studio/review.html"
      - "studio/review-editor.js"
      - "studio/review-editor.css"
      - "studio/app-20260923-48.js"
      - "bridge/apps-script/Code.gs"
      - ".github/workflows/kaggle_web_job.yml"
      - ".github/workflows/soulkey_mvp_validate.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restored legacy workflow and central Final interoperability
        run: |
          node studio/tests/test_bridge_routing.cjs
          node studio/tests/test_review_editor_central_save.cjs
          python -m unittest discover -s translation-system/tests -p test_central_final_sync.py -v
          python translation-system/tests/test_central_tts_recovery_plan.py

      - name: Python syntax
        run: |
          python -m py_compile \
            translation-system/drive_naming.py \
            translation-system/google_io.py \
            translation-system/youtube_io.py \
            translation-system/runner.py \
            translation-system/polish.py \
            translation-system/polish_runner.py \
            translation-system/translate_runner.py \
            translation-system/web_job_worker.py \
            translation-system/tts_engine.py \
            translation-system/tts_runner.py \
            translation-system/translation_engine.py \
            translation-system/batch_full_runner.py \
            translation-system/gemini_engine.py \
            translation-system/gemini_checkpoint.py \
            translation-system/gemini_text_production_runner.py \
            translation-system/gemini_multi_production_runner.py \
            translation-system/github_review_cache.py

      - name: Pipeline regression contracts
        run: |
          python translation-system/tests/test_pipeline_contracts.py
          python translation-system/tests/test_polish_json_resilience.py
          python translation-system/tests/test_review_cache_bridge_resilience.py

      - name: Google Drive resumable upload retry regression
        working-directory: translation-system
        run: |
          python -m unittest -v tests/test_drive_upload_502_retry.py
          python -m unittest -v tests/test_review_preview_delivery.py
          python -m unittest -v tests/test_actions_checkpoint_mirror.py

      - name: Multilingual manuscript preflight regression
        working-directory: translation-system
        run: |
          python -m unittest -v tests/test_multilingual_manuscript_speech_safety.py
          python -m unittest -v tests/test_gemini_engine.py

      - name: Isolated Voice A/B offline regression
        run: |
          python -m unittest -v translation-system/tests/test_voice_ab_runner.py
          python translation-system/experiments/voice_ab_runner.py --samples translation-system/experiments/voice_ab_samples.demo.json --dry-run
      - name: Install audio test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Smart TTS A+B pilot regression
        working-directory: translation-system
        run: |
          python -m unittest -v tests/test_smart_tts_fit.py
          python -m unittest -v tests/test_smart_tts_production_wiring.py
          python -m unittest -v tests/test_complete_audio_delivery.py
          python -m unittest -v tests/test_tts_duration_fit.py
          python -m unittest -v tests/test_natural_tts_punctuation_pause.py

      - name: JavaScript syntax
        run: |
          node --check studio/review-editor.js
          node --check studio/app-20260923-48.js
          cp bridge/apps-script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          node translation-system/tests/test_course_uid_uniqueness.js
          node translation-system/tests/test_schedule_identity_rekey.js

      - name: MVP wiring assertions
        run: |
          grep -q 'args.stage == "finish"' translation-system/web_job_worker.py
          grep -q 'translate-targets' translation-system/translate_runner.py
          grep -q 'youtube.en.json' translation-system/runner.py
          grep -q 'source_en' studio/review-editor.js
          grep -q 'review_finish' studio/review-editor.js
          grep -q 'review_share_finalize_en' bridge/apps-script/Code.gs
          grep -q '"finish"' bridge/apps-script/Code.gs
          grep -q 'zh-TW.final.json' translation-system/translate_runner.py
          grep -q 'WORKFLOW_VERSION = 7' studio/app-20260923-48.js
          grep -q 'youtube_auto_generated_explicit_ytdlp' translation-system/youtube_io.py
          grep -q 'youtube_auto_generated_watch_page' translation-system/youtube_io.py
          grep -q 'youtube_auto_generated_direct_timedtext' translation-system/youtube_io.py
          grep -q 'lang:"cc-refresh"' studio/app-20260923-48.js
          grep -q 'args.lang == "cc-refresh"' translation-system/web_job_worker.py
          grep -q 'meta\["enable_gpu"\] = needs_gpu' .github/workflows/kaggle_web_job.yml
          ! grep -q 'stage == "finish" and bool(lang)' .github/workflows/kaggle_web_job.yml
          grep -q '{"zh", "asr", "batch"}' .github/workflows/kaggle_web_job.yml
          grep -q 'meta.get("machine_shape", "none")' .github/workflows/kaggle_web_job.yml
          ! grep -q 'key:"en", label:"英文翻譯"' studio/app-20260923-48.js
          grep -q 'applyLatestPeriodToNewTask' studio/app-20260923-48.js
          grep -q 'showNoEnglishCcFallback' studio/app-20260923-48.js
          grep -q 'dispatchAiEnglishTranslation' studio/app-20260923-48.js
          grep -q 'refresh-zh-review' studio/app-20260923-48.js
          grep -q 'code:"hi"' studio/app-20260923-48.js
          grep -q 'code:"ta"' studio/app-20260923-48.js
          grep -q '"hi": "Hindi"' translation-system/translation_engine.py
          grep -q '"ta": "Tamil"' translation-system/translation_engine.py
          grep -q '不阻擋流程' translation-system/translate_runner.py
          grep -q 'en.final.json' translation-system/tts_runner.py
          grep -q 'edge-natural-v2' translation-system/tts_runner.py
          grep -q 'hi-IN-MadhurNeural' translation-system/natural_tts_config.py
          grep -q 'ta-IN-ValluvarNeural' translation-system/natural_tts_config.py
          grep -q '_translation_quality_issue' translation-system/translation_engine.py
          grep -q '自動單段重翻' translation-system/translation_engine.py
          grep -q 'STRICT FALLBACK TRANSLATION' translation-system/translation_engine.py
          grep -q '但其他語言繼續' translation-system/translate_runner.py
          grep -q '單一語言錯誤不阻擋其他語言' translation-system/tts_runner.py
          grep -q 'any_failed = True' translation-system/tts_runner.py
          grep -q 'source_sha256' translation-system/tts_engine.py
          grep -q 'source_sha256' translation-system/gemini_multi_production_runner.py
          grep -q 'requestDriveReview("zh",0)' studio/review-editor.js
          grep -q 'requestReviewData(taskId,"en",0)' studio/app-20260923-48.js
          grep -q 'read_planned_target_languages' translation-system/translate_runner.py
          grep -q 'completedStep=i-1' studio/app-20260923-48.js
          grep -q '3 次重翻 + 2 次強制修復' translation-system/translation_engine.py
          ! grep -q 'status = "待人工確認" if result\["review_required_count"\]' translation-system/translate_runner.py
          grep -q 'facebook/mms-tts-hin' translation-system/config.py
          ! grep -q 'GeminiClient' translation-system/tts_engine.py
          ! grep -q 'synthesize_gemini_language' translation-system/tts_runner.py
          grep -q 'run_taiwan_breeze_asr' translation-system/web_job_worker.py
          grep -q 'Taiwan-Breeze 為正式主 ASR' translation-system/web_job_worker.py
          grep -q '"batch"' bridge/apps-script/Code.gs
          grep -q '"batch"' translation-system/web_job_worker.py
          grep -q 'gpu_stages = {"zh", "asr", "batch"}' .github/workflows/kaggle_web_job.yml
          grep -q 'batch_full_runner.py' translation-system/web_job_worker.py
          grep -q 'facebook/mms-tts-tam' translation-system/config.py
          grep -q 'course_files' bridge/apps-script/Code.gs
          grep -q 'course-files-panel' studio/index.html
          grep -q 'data-course-file-copy' studio/app-20260923-48.js
