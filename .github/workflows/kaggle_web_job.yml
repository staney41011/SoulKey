name: Kaggle Web Job

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: SoulKey task id
        required: true
        type: string
      stage:
        description: zh/cc/en/multi/tts/finish
        required: true
        type: string
      lang:
        description: Optional single language code
        required: false
        default: ""
        type: string
      langs:
        description: Optional comma-separated language codes
        required: false
        default: ""
        type: string
      runtime_nonce:
        description: Short-lived SoulKey runtime nonce
        required: true
        type: string
      bridge_url:
        description: Apps Script web app URL
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: soulkey-kaggle-web-worker
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: cwlmrcsir/soulkey-gpu-worker

    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

      - name: Prepare dedicated GPU Worker
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-web-worker"
          rm -rf "$DIR"
          mkdir -p "$DIR"

          # Use a separate GPU-only Kaggle kernel so an old CPU kernel/version
          # cannot carry stale accelerator settings into production jobs.
          if kaggle kernels pull "$KAGGLE_KERNEL" -p "$DIR" -m; then
            echo "Pulled existing dedicated GPU worker."
          else
            echo "Dedicated GPU worker does not exist yet; creating clean metadata."
            cat > "$DIR/kernel-metadata.json" <<'JSON'
          {
            "id": "cwlmrcsir/soulkey-gpu-worker",
            "title": "SoulKey GPU Worker",
            "code_file": "soulkey-gpu-worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": ["cwlmrcsir/translate-system"],
            "model_sources": []
          }
          JSON
            printf 'print("SoulKey GPU worker bootstrap")\n' > "$DIR/soulkey-gpu-worker.py"
          fi

          cat "$DIR/kernel-metadata.json"

      - name: Build formal SoulKey job
        shell: bash
        env:
          JOB_TASK_ID: ${{ inputs.task_id }}
          JOB_STAGE: ${{ inputs.stage }}
          JOB_LANG: ${{ inputs.lang }}
          JOB_LANGS: ${{ inputs.langs }}
          JOB_RUNTIME_NONCE: ${{ inputs.runtime_nonce }}
          JOB_BRIDGE_URL: ${{ inputs.bridge_url }}
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-web-worker"

          python - <<'PY'
          import json, os
          from pathlib import Path

          d = Path(os.environ["RUNNER_TEMP"]) / "soulkey-web-worker"
          meta_path = d / "kernel-metadata.json"
          meta = json.loads(meta_path.read_text(encoding="utf-8"))

          stage = os.environ["JOB_STAGE"].strip()
          lang = os.environ["JOB_LANG"].strip()
          gpu_stages = {"zh", "asr", "tts", "batch"}
          needs_gpu = (
              stage in gpu_stages
              or (stage == "finish" and bool(lang))
          )

          # Rebind every run to the dedicated GPU-only kernel. Do not preserve
          # id_no from an older CPU worker because Kaggle prefers id_no over id.
          meta.pop("id_no", None)
          meta["id"] = "cwlmrcsir/soulkey-gpu-worker"
          meta["title"] = "SoulKey GPU Worker"
          meta["code_file"] = "soulkey-gpu-worker.py"
          meta["kernel_type"] = "script"
          meta["language"] = "python"
          meta["is_private"] = True
          meta["enable_internet"] = True
          meta["enable_gpu"] = needs_gpu
          meta["enable_tpu"] = False
          if meta["enable_gpu"]:
              meta["machine_shape"] = "NvidiaTeslaT4"
          else:
              meta.pop("machine_shape", None)
          meta["kernel_sources"] = ["cwlmrcsir/translate-system"]
          meta["dataset_sources"] = []
          meta["competition_sources"] = []
          meta["model_sources"] = []

          meta_path.write_text(
              json.dumps(meta, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          job = {
              "task_id": os.environ["JOB_TASK_ID"].strip(),
              "stage": stage,
              "lang": lang,
              "langs": os.environ["JOB_LANGS"].strip(),
              "runtime_nonce": os.environ["JOB_RUNTIME_NONCE"].strip(),
              "bridge_url": os.environ["JOB_BRIDGE_URL"].strip(),
          }

          code_file = meta["code_file"]
          job_literal = repr(job)
          bootstrap = r'''
          import subprocess
          import sys
          from pathlib import Path

          job = __SOULKEY_JOB_LITERAL__

          repo = Path("/kaggle/working/SoulKey")'''.replace(
              "__SOULKEY_JOB_LITERAL__",
              job_literal,
          ) + r'''
          subprocess.run(
              [
                  "git", "clone", "--depth", "1",
                  "https://github.com/staney41011/SoulKey.git",
                  str(repo),
              ],
              check=True,
          )

          cmd = [
              sys.executable,
              str(repo / "translation-system" / "web_job_worker.py"),
              "--task-id", job["task_id"],
              "--stage", job["stage"],
              "--bridge-url", job["bridge_url"],
              "--runtime-nonce=" + job["runtime_nonce"],
          ]
          if job.get("lang"):
              cmd += ["--lang", job["lang"]]
          if job.get("langs"):
              cmd += ["--langs", job["langs"]]

          subprocess.run(cmd, check=True)
          '''
          (d / code_file).write_text(bootstrap, encoding="utf-8")

          print("Formal job prepared:", job["task_id"], job["stage"])
          print(
              "GPU forced:",
              meta["enable_gpu"],
              meta.get("machine_shape", "none"),
          )
          PY

          cat "$DIR/kernel-metadata.json"

      - name: Run Kaggle job with GPU retry
        id: wait_job
        shell: bash
        env:
          JOB_STAGE: ${{ inputs.stage }}
          JOB_LANG: ${{ inputs.lang }}
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-web-worker"
          STAGE="${JOB_STAGE}"
          LANG="${JOB_LANG}"
          FINAL_STATUS="UNKNOWN"
          MAX_ATTEMPTS=1

          if [[ "$STAGE" =~ ^(zh|asr|tts|batch)$ ]] || { [[ "$STAGE" == "finish" ]] && [[ -n "$LANG" ]]; }; then
            MAX_ATTEMPTS=3
          fi

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "============================================================"
            echo "Kaggle attempt $ATTEMPT / $MAX_ATTEMPTS"
            echo "============================================================"

            if [[ "$STAGE" == "batch" ]]; then
              echo "Launching Kaggle batch with NvidiaTeslaT4 accelerator; timeout=14400s"
              kaggle kernels push -p "$DIR" --accelerator NvidiaTeslaT4 -t 14400
            elif [[ "$STAGE" =~ ^(zh|asr|tts)$ ]] || { [[ "$STAGE" == "finish" ]] && [[ -n "$LANG" ]]; }; then
              echo "Launching Kaggle with NvidiaTeslaT4 accelerator; timeout=7200s"
              kaggle kernels push -p "$DIR" --accelerator NvidiaTeslaT4 -t 7200
            else
              echo "Launching Kaggle without accelerator; timeout=3600s"
              kaggle kernels push -p "$DIR" -t 3600
            fi

            ATTEMPT_STATUS="UNKNOWN"
            if [[ "$STAGE" == "batch" ]]; then
              POLL_LIMIT=1440
            else
              POLL_LIMIT=720
            fi

            for i in $(seq 1 "$POLL_LIMIT"); do
              STATUS="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1 || true)"
              echo "$STATUS"

              if echo "$STATUS" | grep -Eqi 'complete|completed'; then
                ATTEMPT_STATUS="COMPLETE"
                break
              fi

              if echo "$STATUS" | grep -Eqi 'error|failed|failure|cancel'; then
                ATTEMPT_STATUS="ERROR"
                break
              fi

              # Kaggle can briefly keep reporting RUNNING after the Python
              # process has already written its fatal top-level error. Poll the
              # live log every ~30s so one failed batch cannot occupy the global
              # SoulKey worker for hours.
              if (( i % 3 == 0 )); then
                LIVE_LOG="$(kaggle kernels logs "$KAGGLE_KERNEL" 2>&1 || true)"
                if echo "$LIVE_LOG" | grep -q '\[WEB-WORKER ERROR\]'; then
                  echo "Detected fatal WEB-WORKER error from live Kaggle log."
                  ATTEMPT_STATUS="ERROR"
                  break
                fi
              fi

              sleep 10
            done

            if [ "$ATTEMPT_STATUS" = "COMPLETE" ]; then
              FINAL_STATUS="COMPLETE"
              break
            fi

            # Kaggle sometimes accepts the T4 request but still starts a CPU-only
            # session. Inspect only the kernel log; never download the whole
            # output bundle just to detect this error.
            ATTEMPT_LOG="$(timeout 60s kaggle kernels logs "$KAGGLE_KERNEL" 2>&1 || true)"

            if echo "$ATTEMPT_LOG" | grep -q "GPU_REQUIRED_BUT_UNAVAILABLE"; then
              echo "Kaggle did not attach a real CUDA GPU on attempt $ATTEMPT."
              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                echo "Waiting 20 seconds and retrying T4 allocation..."
                sleep 20
                continue
              fi
            fi

            # Batch jobs are checkpoint-safe. Any worker failure can be resumed
            # from Drive/GitHub checkpoints without repeating completed stages.
            # Retry inside the SAME authenticated workflow while the runtime
            # nonce is still valid, so the user does not need to press Run again.
            if [ "$STAGE" = "batch" ] && [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Batch attempt failed; waiting 30 seconds and resuming from checkpoint..."
              sleep 30
              continue
            fi

            FINAL_STATUS="$ATTEMPT_STATUS"
            break
          done

          echo "final_status=$FINAL_STATUS" >> "$GITHUB_OUTPUT"
          echo "Kaggle final status: $FINAL_STATUS"

      - name: Download Kaggle log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/soulkey-web-job-output"
          mkdir -p "$OUT"

          # Do not use `kaggle kernels output` here. A completed TTS job can
          # contain hundreds of WAV files and the GitHub runner may spend a long
          # time downloading them even though this step only needs diagnostics.
          # Fetch the kernel log directly and bound the call so the workflow can
          # always reach its final status / retry logic.
          LOG="$OUT/kaggle.log"
          timeout 90s kaggle kernels logs "$KAGGLE_KERNEL" >"$LOG" 2>&1 || true

          if [ -s "$LOG" ]; then
            echo "----- Kaggle log tail -----"
            tail -n 180 "$LOG"
          else
            echo "No Kaggle log text returned."
          fi

      - name: Report Kaggle failure to Bridge
        if: always() && steps.wait_job.outputs.final_status != 'COMPLETE'
        shell: bash
        env:
          JOB_RUNTIME_NONCE: ${{ inputs.runtime_nonce }}
          JOB_BRIDGE_URL: ${{ inputs.bridge_url }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$JOB_BRIDGE_URL" \
            --data-urlencode "action=worker_report" \
            --data-urlencode "nonce=$JOB_RUNTIME_NONCE" \
            --data-urlencode "status=error" \
            --data-urlencode "message=Kaggle Kernel 執行失敗；請查看 GitHub Actions / Kaggle log" \
            >/dev/null || true

      - name: Verify Kaggle job
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.wait_job.outputs.final_status }}" != "COMPLETE" ]; then
            echo "Kaggle job failed: ${{ steps.wait_job.outputs.final_status }}"
            exit 1
          fi
          echo "SoulKey Kaggle Web Job completed."
