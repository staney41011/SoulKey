name: Kaggle Web Job

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: SoulKey task id
        required: true
        type: string
      stage:
        description: zh/cc/en/multi/tts/finish
        required: true
        type: string
      lang:
        description: Optional single language code
        required: false
        default: ""
        type: string
      langs:
        description: Optional comma-separated language codes
        required: false
        default: ""
        type: string
      runtime_nonce:
        description: Short-lived SoulKey runtime nonce
        required: true
        type: string
      bridge_url:
        description: Apps Script web app URL
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: soulkey-kaggle-web-worker
  queue: max
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: cwlmrcsir/soulkey-gpu-worker

    steps:
      - uses: actions/checkout@v4

      # GitHub re-run uses the ORIGINAL nonce. A prior 8-hour nonce can
      # expire while Kaggle is synthesizing audio, causing Drive writes to
      # fail after GPU time is consumed. Check original Apps Script first.
      - name: Verify fresh original Apps Script runtime before Kaggle
        id: runtime_preflight
        env:
          SOULKEY_PREFLIGHT_TASK_ID: ${{ inputs.task_id }}
          SOULKEY_PREFLIGHT_STAGE: ${{ inputs.stage }}
          SOULKEY_PREFLIGHT_LANG: ${{ inputs.lang }}
          SOULKEY_PREFLIGHT_LANGS: ${{ inputs.langs }}
          SOULKEY_PREFLIGHT_RUNTIME_NONCE: ${{ inputs.runtime_nonce }}
          SOULKEY_PREFLIGHT_BRIDGE_URL: ${{ inputs.bridge_url }}
        run: python -u translation-system/bridge_runtime_preflight.py

      # The preflight intentionally aborts stale runs before wasting Kaggle
      # GPU time. While the nonce still exists, report a real error to Studio
      # and release the per-task dispatch lease rather than leaving "running".
      - name: Report rejected runtime preflight to original Studio
        if: ${{ failure() && steps.runtime_preflight.outcome == 'failure' }}
        env:
          SOULKEY_PREFLIGHT_RUNTIME_NONCE: ${{ inputs.runtime_nonce }}
          SOULKEY_PREFLIGHT_BRIDGE_URL: ${{ inputs.bridge_url }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          data=urllib.parse.urlencode({
              "action":"worker_report",
              "nonce":os.environ["SOULKEY_PREFLIGHT_RUNTIME_NONCE"],
              "status":"error",
              "message":"授權檢查未通過，Kaggle 未啟動；請由 SoulKey Studio 重新派送新工作。"
          }).encode("utf-8")
          try:
              request=urllib.request.Request(
                  os.environ["SOULKEY_PREFLIGHT_BRIDGE_URL"],
                  data=data,method="POST")
              with urllib.request.urlopen(request,timeout=20) as response:
                  receipt=json.loads(response.read(8192).decode("utf-8"))
              print("SOULKEY_PREFLIGHT_STATUS_REPORTED",
                    "yes" if receipt.get("ok") else "unconfirmed")
          except Exception as exc:
              print("SOULKEY_PREFLIGHT_STATUS_UNCONFIRMED",
                    type(exc).__name__)
          PY

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

      - name: Prepare dedicated GPU Worker
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-web-worker"
          rm -rf "$DIR"
          mkdir -p "$DIR"

          # Use a separate GPU-only Kaggle kernel so an old CPU kernel/version
          # cannot carry stale accelerator settings into production jobs.
          if kaggle kernels pull "$KAGGLE_KERNEL" -p "$DIR" -m; then
            echo "Pulled existing dedicated GPU worker."
          else
            echo "Dedicated GPU worker does not exist yet; creating clean metadata."
            cat > "$DIR/kernel-metadata.json" <<'JSON'
          {
            "id": "cwlmrcsir/soulkey-gpu-worker",
            "title": "SoulKey GPU Worker",
            "code_file": "soulkey-gpu-worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": ["cwlmrcsir/translate-system"],
            "model_sources": []
          }
          JSON
            printf 'print("SoulKey GPU worker bootstrap")\n' > "$DIR/soulkey-gpu-worker.py"
          fi

          cat "$DIR/kernel-metadata.json"

      - name: Build formal SoulKey job
        shell: bash
        env:
          JOB_TASK_ID: ${{ inputs.task_id }}
          JOB_STAGE: ${{ inputs.stage }}
          JOB_LANG: ${{ inputs.lang }}
          JOB_LANGS: ${{ inputs.langs }}
          JOB_RUNTIME_NONCE: ${{ inputs.runtime_nonce }}
          JOB_BRIDGE_URL: ${{ inputs.bridge_url }}
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-web-worker"

          python - <<'PY'
          import json, os
          from pathlib import Path

          d = Path(os.environ["RUNNER_TEMP"]) / "soulkey-web-worker"
          meta_path = d / "kernel-metadata.json"
          meta = json.loads(meta_path.read_text(encoding="utf-8"))

          stage = os.environ["JOB_STAGE"].strip()
          lang = os.environ["JOB_LANG"].strip()
          gpu_stages = {"zh", "asr", "batch"}
          p259_gemma4 = (stage == "multi" or (stage == "finish" and bool(os.environ["JOB_LANGS"].strip()))) and os.environ["JOB_TASK_ID"].strip() in {"P259-L01","P259-L02","P259-L03","P259-L04"}
          # The existing Studio central4 authorization prioritizes L04 Gemini
          # and Edge TTS on Kaggle CPU, preserving weekly GPU quota.
          central4_l04_cpu = (stage == "multi" and lang == "central4"
              and os.environ["JOB_TASK_ID"].strip() == "P259-L01")
          needs_gpu = stage in gpu_stages or (p259_gemma4 and not central4_l04_cpu)

          # Rebind every run to the dedicated GPU-only kernel. Do not preserve
          # id_no from an older CPU worker because Kaggle prefers id_no over id.
          meta.pop("id_no", None)
          meta["id"] = "cwlmrcsir/soulkey-gpu-worker"
          meta["title"] = "SoulKey GPU Worker"
          meta["code_file"] = "soulkey-gpu-worker.py"
          meta["kernel_type"] = "script"
          meta["language"] = "python"
          meta["is_private"] = True
          meta["enable_internet"] = True
          meta["enable_gpu"] = needs_gpu
          meta["enable_tpu"] = False
          if meta["enable_gpu"]:
              meta["machine_shape"] = "NvidiaTeslaT4"
          else:
              meta.pop("machine_shape", None)
          meta["kernel_sources"] = ["cwlmrcsir/translate-system"]
          meta["dataset_sources"] = []
          meta["competition_sources"] = []
          # Gemma loads the public GGUF in the worker. Kaggle API submissions
          # cannot attach a newly gated model interactively; that obsolete
          # attachment rejected the job before our existing OAuth ran.
          meta["model_sources"] = []
          # `kernels pull -m` includes the old worker's immutable Docker digest.
          # Keeping it silently restores an Ubuntu 22 image whose glibc/libstdc++
          # cannot load the official Gemma4 CUDA binaries. Kaggle's supported
          # latest pinning must also discard that digest; credentials, source
          # notebooks and the dedicated worker identity stay the same.
          if p259_gemma4:
              meta.pop("docker_image", None)
              meta["docker_image_pinning_type"] = "latest"

          meta_path.write_text(
              json.dumps(meta, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          job = {
              "task_id": os.environ["JOB_TASK_ID"].strip(),
              "stage": stage,
              "lang": lang,
              "langs": os.environ["JOB_LANGS"].strip(),
              "runtime_nonce": os.environ["JOB_RUNTIME_NONCE"].strip(),
              "bridge_url": os.environ["JOB_BRIDGE_URL"].strip(),
          }

          code_file = meta["code_file"]
          job_literal = repr(job)
          bootstrap = r'''
          import subprocess
          import sys
          from pathlib import Path

          job = __SOULKEY_JOB_LITERAL__

          repo = Path("/kaggle/working/SoulKey")'''.replace(
              "__SOULKEY_JOB_LITERAL__",
              job_literal,
          ) + r'''
          subprocess.run(
              [
                  "git", "clone", "--depth", "1",
                  "https://github.com/staney41011/SoulKey.git",
                  str(repo),
              ],
              check=True,
          )

          cmd = [
              sys.executable,
              str(repo / "translation-system" / "web_job_worker.py"),
              "--task-id", job["task_id"],
              "--stage", job["stage"],
              "--bridge-url", job["bridge_url"],
              "--runtime-nonce=" + job["runtime_nonce"],
          ]
          if job.get("lang"):
              cmd += ["--lang", job["lang"]]
          if job.get("langs"):
              cmd += ["--langs", job["langs"]]

          # Never let CalledProcessError echo the full command: it contains
          # the private Apps Script runtime nonce used for Google OAuth.
          worker_exit = subprocess.run(cmd, check=False).returncode
          if worker_exit:
              print("SOULKEY_WEB_WORKER_EXIT_CODE",worker_exit,flush=True)
              raise SystemExit(worker_exit)
          '''
          (d / code_file).write_text(bootstrap, encoding="utf-8")

          print("Formal job prepared:", job["task_id"], job["stage"])
          print(
              "GPU forced:",
              meta["enable_gpu"],
              meta.get("machine_shape", "none"),
          )
          PY

          cat "$DIR/kernel-metadata.json"

      - name: Run Kaggle job with GPU retry
        id: wait_job
        shell: bash
        env:
          JOB_STAGE: ${{ inputs.stage }}
          JOB_LANG: ${{ inputs.lang }}
          JOB_TASK_ID: ${{ inputs.task_id }}
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-web-worker"
          STAGE="${JOB_STAGE}"
          LANG="${JOB_LANG}"
          TASK_ID="${JOB_TASK_ID}"
          FINAL_STATUS="UNKNOWN"
          MAX_ATTEMPTS=1

          if [[ "$STAGE" =~ ^(zh|asr|tts|batch)$ ]] || { [[ "$STAGE" == "finish" ]] && [[ -n "$LANG" ]]; }; then
            MAX_ATTEMPTS=3
          fi

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "============================================================"
            echo "Kaggle attempt $ATTEMPT / $MAX_ATTEMPTS"
            echo "============================================================"

            ATTEMPT_STARTED_AT="$(date +%s)"
            if [[ "$STAGE" == "batch" ]]; then
              echo "Launching Kaggle batch with NvidiaTeslaT4 accelerator; timeout=14400s"
              kaggle kernels push -p "$DIR" --accelerator NvidiaTeslaT4 -t 14400
            elif [[ "$TASK_ID" =~ ^P259-L0[1-4]$ ]] && python -c 'import json,sys;sys.exit(not json.load(open(sys.argv[1])).get("enable_gpu"))' "$DIR/kernel-metadata.json"; then
              echo "Launching P259 Gemma4 GPU with existing Bridge OAuth; timeout=14400s"
              kaggle kernels push -p "$DIR" --accelerator NvidiaTeslaT4 -t 14400
            elif [[ "$STAGE" =~ ^(multi|tts)$ && "$LANG" == "central4" ]]; then
              echo "Launching P259 four-lesson Kaggle CPU recovery; timeout=14400s"
              kaggle kernels push -p "$DIR" -t 14400
            elif [[ "$STAGE" =~ ^(zh|asr)$ ]]; then
              echo "Launching Kaggle with NvidiaTeslaT4 accelerator; timeout=7200s"
              kaggle kernels push -p "$DIR" --accelerator NvidiaTeslaT4 -t 7200
            else
              echo "Launching Kaggle without accelerator; timeout=3600s"
              kaggle kernels push -p "$DIR" -t 3600
            fi

            ATTEMPT_STATUS="UNKNOWN"
            if [[ "$STAGE" == "batch" || ( "$STAGE" =~ ^(multi|finish)$ && "$TASK_ID" =~ ^P259-L0[1-4]$ ) || ( "$STAGE" =~ ^(multi|tts)$ && "$LANG" == "central4" ) ]]; then
              POLL_LIMIT=1440
            else
              POLL_LIMIT=720
            fi

            for i in $(seq 1 "$POLL_LIMIT"); do
              STATUS="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1 || true)"
              echo "$STATUS"

              if echo "$STATUS" | grep -Eqi 'complete|completed'; then
                ATTEMPT_STATUS="COMPLETE"
                break
              fi

              if echo "$STATUS" | grep -Eqi 'error|failed|failure|cancel'; then
                ATTEMPT_STATUS="ERROR"
                break
              fi

              # Kaggle can briefly keep reporting RUNNING after the Python
              # process has already written its fatal top-level error. Poll the
              # live log every ~30s so one failed batch cannot occupy the global
              # SoulKey worker for hours.
              if (( i % 3 == 0 )); then
                LIVE_LOG="$(kaggle kernels logs "$KAGGLE_KERNEL" 2>&1 || true)"
                if echo "$LIVE_LOG" | grep -q '\[WEB-WORKER ERROR\]'; then
                  echo "Detected fatal WEB-WORKER error from live Kaggle log."
                  ATTEMPT_STATUS="ERROR"
                  break
                fi
              fi

              sleep 10
            done

            if [ "$ATTEMPT_STATUS" = "COMPLETE" ]; then
              FINAL_STATUS="COMPLETE"
              break
            fi

            # Kaggle sometimes accepts the T4 request but still starts a CPU-only
            # session. Inspect only the kernel log; never download the whole
            # output bundle just to detect this error.
            ATTEMPT_LOG="$(timeout 60s kaggle kernels logs "$KAGGLE_KERNEL" 2>&1 || true)"

            if echo "$ATTEMPT_LOG" | grep -q "GPU_REQUIRED_BUT_UNAVAILABLE"; then
              echo "Kaggle did not attach a real CUDA GPU on attempt $ATTEMPT."
              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                echo "Waiting 20 seconds and retrying T4 allocation..."
                sleep 20
                continue
              fi
            fi

            # A short-lived Kaggle ERROR with an entirely empty kernel log
            # happens before Python/ASR can provide diagnostic output. Retry
            # this infrastructure startup failure with the SAME runtime nonce.
            ATTEMPT_ELAPSED=$(( $(date +%s) - ATTEMPT_STARTED_AT ))
            COMPACT_LOG="$(printf '%s' "$ATTEMPT_LOG" | tr -d '[:space:]')"
            if [[ "$STAGE" =~ ^(zh|asr)$ ]] \
               && [ "$ATTEMPT_STATUS" = "ERROR" ] \
               && [ "$ATTEMPT_ELAPSED" -lt 120 ] \
               && { [ -z "$COMPACT_LOG" ] || [ "$COMPACT_LOG" = "[]" ]; }; then
              echo "[KAGGLE STARTUP] $STAGE failed after $ATTEMPT_ELAPSED seconds with no kernel log; worker did not confirm startup."
              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                RETRY_DELAY=$((20 * ATTEMPT))
                echo "[KAGGLE STARTUP] Waiting $RETRY_DELAY seconds before GPU retry, attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS."
                sleep "$RETRY_DELAY"
                continue
              fi
              echo "[KAGGLE STARTUP] Retries exhausted; infrastructure failed before ASR."
            fi

            # Batch jobs are checkpoint-safe. Any worker failure can be resumed
            # from Drive/GitHub checkpoints without repeating completed stages.
            # Retry inside the SAME authenticated workflow while the runtime
            # nonce is still valid, so the user does not need to press Run again.
            if [ "$STAGE" = "batch" ] && [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Batch attempt failed; waiting 30 seconds and resuming from checkpoint..."
              sleep 30
              continue
            fi

            FINAL_STATUS="$ATTEMPT_STATUS"
            break
          done

          echo "final_status=$FINAL_STATUS" >> "$GITHUB_OUTPUT"
          echo "Kaggle final status: $FINAL_STATUS"

      - name: Download Kaggle log
        if: always() && steps.runtime_preflight.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/soulkey-web-job-output"
          mkdir -p "$OUT"

          # Do not use `kaggle kernels output` here. A completed TTS job can
          # contain hundreds of WAV files and the GitHub runner may spend a long
          # time downloading them even though this step only needs diagnostics.
          # Fetch the kernel log directly and bound the call so the workflow can
          # always reach its final status / retry logic.
          LOG="$OUT/kaggle.log"
          timeout 90s kaggle kernels logs "$KAGGLE_KERNEL" >"$LOG" 2>&1 || true

          if [ -s "$LOG" ]; then
            echo "----- Kaggle log tail -----"
            # Redact old-style nonce-bearing traceback lines as a second
            # defence even if a nested worker forgets to sanitize errors.
            tail -n 180 "$LOG" | sed -E 's/job_[A-Za-z0-9_-]{30,}/[REDACTED_RUNTIME_NONCE]/g'
          else
            echo "No Kaggle log text returned."
          fi

      - name: Report Kaggle failure to Bridge
        if: always() && steps.runtime_preflight.outcome == 'success' && steps.wait_job.outputs.final_status != 'COMPLETE'
        shell: bash
        env:
          JOB_RUNTIME_NONCE: ${{ inputs.runtime_nonce }}
          JOB_BRIDGE_URL: ${{ inputs.bridge_url }}
        run: |
          set -euo pipefail
          curl -fsS -X POST "$JOB_BRIDGE_URL" \
            --data-urlencode "action=worker_report" \
            --data-urlencode "nonce=$JOB_RUNTIME_NONCE" \
            --data-urlencode "status=error" \
            --data-urlencode "message=Kaggle Kernel 執行失敗；請查看 GitHub Actions / Kaggle log" \
            >/dev/null || true

      - name: Verify Kaggle job
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.runtime_preflight.outcome }}" != "success" ]; then
            echo "Kaggle was deliberately NOT launched: legacy Apps Script nonce requires a NEW Studio dispatch."
            exit 1
          fi
          if [ "${{ steps.wait_job.outputs.final_status }}" != "COMPLETE" ]; then
            echo "Kaggle job failed: ${{ steps.wait_job.outputs.final_status }}"
            exit 1
          fi
          echo "SoulKey Kaggle Web Job completed."
