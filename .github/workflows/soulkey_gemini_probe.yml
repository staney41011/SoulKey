name: SoulKey Gemini Model Probe
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/soulkey_gemini_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Verify Gemini model can return structured translation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          key=os.environ.get("GEMINI_API_KEY","")
          if not key:
              raise SystemExit("GEMINI_SECRET_MISSING")
          model="gemini-3.5-flash-lite"
          url="https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent"
          body={"contents":[{"role":"user","parts":[{"text":"Return ONLY a JSON object with segments array containing id 0 and Spanish translation of 'Welcome'."}]}],
                "generationConfig":{"responseMimeType":"application/json","maxOutputTokens":1024,
                 "responseJsonSchema":{"type":"object","properties":{"segments":{"type":"array","items":
                     {"type":"object","properties":{"id":{"type":"integer"},"text":{"type":"string"}},
                      "required":["id","text"]}}},"required":["segments"]}}}
          req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={"Content-Type":"application/json","x-goog-api-key":key},method="POST")
          try:
              with urllib.request.urlopen(req,timeout=80) as r:
                  result=json.load(r)
              txt="".join(x.get("text","") for x in result["candidates"][0]["content"]["parts"])
              parsed=json.loads(txt)
              assert isinstance(parsed.get("segments"),list) and parsed["segments"],"Missing segments"
              assert int(parsed["segments"][0].get("id",-1))==0,"Wrong ID"
              print("GEMINI_MODEL_SCHEMA_PREFLIGHT_OK",model)
          except urllib.error.HTTPError as exc:
              detail=exc.read(1000).decode("utf-8","replace")
              try:
                  info=json.loads(detail).get("error",{})
                  print("GEMINI_MODEL_HTTP_ERROR",exc.code,info.get("status",""),str(info.get("message",""))[:240])
              except Exception:
                  print("GEMINI_MODEL_HTTP_ERROR",exc.code)
              raise SystemExit(1)
          PY
