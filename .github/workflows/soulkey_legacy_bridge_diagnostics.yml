name: SoulKey Legacy Bridge Connectivity Diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/soulkey_legacy_bridge_diagnostics.yml

permissions:
  contents: read

jobs:
  public-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public Apps Script / Cloud Run health without credentials
        shell: bash
        env:
          LEGACY_URL: https://script.google.com/macros/s/AKfycbyyMjEUqDdhsXWwCWKRTjpyhzdrdXnKhJYZIyiQ-QblOR_nhUdxtv9tqujw5VHkbyZ3/exec
          READ_URL: https://soulkey-bridge-214901732194.asia-east1.run.app
        run: |
          set -euo pipefail
          for svc in legacy read; do
            if [[ "$svc" == legacy ]]; then url="$LEGACY_URL"; else url="$READ_URL"; fi
            echo "PROBE_SERVICE=$svc"
            response=$(mktemp)
            headers=$(mktemp)
            status=$(curl -sS -L --max-redirs 5 -m 18 -D "$headers" -o "$response" -w '%{http_code}' "$url" || true)
            echo "HTTP_STATUS=$status"
            echo "LAST_CONTENT_TYPE=$(grep -i '^content-type:' "$headers" | tail -1 | tr -d '\r' || true)"
            echo "RESPONSE_HEAD=$(head -c 260 "$response" | tr '\r\n' '  ')"
            rm -f "$headers" "$response"
          done
