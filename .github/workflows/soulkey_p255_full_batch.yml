name: SoulKey P255 Full Batch

on:
  push:
    paths:
      - "translation-system/P255_FULL_BATCH_TRIGGER"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soulkey-p255-full-batch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: cwlmrcsir/soulkey-p255-full-batch

    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

      - name: Build P255 batch kernel
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-p255-full-batch"
          rm -rf "$DIR"
          mkdir -p "$DIR"

          cat > "$DIR/kernel-metadata.json" <<'JSON'
          {
            "id": "cwlmrcsir/soulkey-p255-full-batch",
            "title": "SoulKey P255 Full Batch",
            "code_file": "soulkey-p255-full-batch.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": ["cwlmrcsir/translate-system"],
            "model_sources": []
          }
          JSON

          cat > "$DIR/soulkey-p255-full-batch.py" <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          repo = Path("/kaggle/working/SoulKey")
          subprocess.run(
              [
                  "git", "clone", "--depth", "1",
                  "https://github.com/staney41011/SoulKey.git",
                  str(repo),
              ],
              check=True,
          )

          system_dir = repo / "translation-system"

          subprocess.run(
              [
                  sys.executable, "-m", "pip", "install",
                  "--disable-pip-version-check", "-q",
                  "-r", str(system_dir / "requirements.txt"),
              ],
              check=True,
          )

          subprocess.run(
              [
                  sys.executable, "-u",
                  str(system_dir / "batch_full_runner.py"),
                  "--task-ids", "P255-L01,P255-L02",
              ],
              check=True,
          )
          PY

          cat "$DIR/kernel-metadata.json"

      - name: Launch Kaggle T4 batch
        id: run_batch
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-p255-full-batch"

          kaggle kernels push             -p "$DIR"             --accelerator NvidiaTeslaT4             -t 14400

          FINAL_STATUS="UNKNOWN"
          for i in $(seq 1 1440); do
            STATUS="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1 || true)"
            echo "$STATUS"

            if echo "$STATUS" | grep -Eqi 'complete|completed'; then
              FINAL_STATUS="COMPLETE"
              break
            fi

            if echo "$STATUS" | grep -Eqi 'error|failed|failure|cancel'; then
              FINAL_STATUS="ERROR"
              break
            fi

            sleep 10
          done

          echo "final_status=$FINAL_STATUS" >> "$GITHUB_OUTPUT"

      - name: Download Kaggle logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/p255-batch-output"
          mkdir -p "$OUT"
          kaggle kernels output "$KAGGLE_KERNEL" -p "$OUT" -o || true
          LOG="$(find "$OUT" -type f -name '*.log' | head -n 1 || true)"
          if [ -n "$LOG" ]; then
            echo "----- P255 batch log tail -----"
            tail -n 300 "$LOG"
          fi

      - name: Verify P255 batch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.run_batch.outputs.final_status }}" != "COMPLETE" ]; then
            echo "P255 batch failed: ${{ steps.run_batch.outputs.final_status }}"
            exit 1
          fi
          echo "P255 batch completed."
