name: P259 VoxCPM2 Kaggle status snapshot
on:
  push:
    branches:
      - benchmark/voxcpm2-kaggle-p259-l04
    paths:
      - .github/workflows/p259_l04_voxcpm2_kaggle_status.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Snapshot actual Kaggle GPU kernel
        shell: bash
        run: |
          python -m pip install -q kaggle
          echo "KAGGLE_SNAPSHOT_BEGIN"
          kaggle kernels status cwlmrcsir/soulkey-voxcpm2-kaggle-t4-benchmark-p259-l04 || true
          echo "KAGGLE_SNAPSHOT_END"
