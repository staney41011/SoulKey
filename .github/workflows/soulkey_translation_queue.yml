name: SoulKey Translation Queue Worker

on:
  schedule:
    # Multi-language text translation runs on GitHub CPU, conserving Kaggle GPU.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: soulkey-translation-queue
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SOULKEY_GEMINI_MODEL: gemini-3.5-flash-lite
      SOULKEY_P259_GEMINI_MODEL: gemini-3.1-flash-lite
      SOULKEY_BRIDGE_URL: https://soulkey-bridge-214901732194.asia-east1.run.app
    steps:
      - uses: actions/checkout@v4
      - name: Validate worker availability
        shell: bash
        run: |
          python -m py_compile cloud-bridge/translation_worker.py
          python -m py_compile cloud-bridge/nllb_cpu.py
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "::error::GEMINI_API_KEY is not available; no job will be claimed."
            exit 1
          fi
          echo "SOULKEY_GEMINI_SECRET_PRESENT"
          echo "SOULKEY_GEMINI_MODEL=$SOULKEY_GEMINI_MODEL"
      - name: Detect live QA bridge capabilities
        shell: bash
        run: python -u cloud-bridge/check_worker_capabilities.py
      - name: Recover and process up to three queued jobs sequentially
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          # Independent jobs: errors do not prevent the next queued lesson
          # from being picked up. Each failure is recorded in the central queue.
          for slot in 1 2 3; do
            echo "SOULKEY_QUEUE_SLOT=$slot"
            if ! python -u cloud-bridge/translation_worker.py; then
              failures=$((failures+1))
              echo "::warning::Translation slot $slot failed; next job remains independent"
            fi
          done
          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures translation slots failed"
            exit 1
          fi
      - name: Preserve Gemini QA audit receipts (no manuscripts or secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-qa-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/soulkey-qa-receipts.jsonl
          if-no-files-found: ignore
          retention-days: 30
