name: SoulKey Translation Queue Worker

on:
  schedule:
    # Multi-language text translation runs on GitHub CPU, conserving Kaggle GPU.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: soulkey-translation-queue
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SOULKEY_GEMINI_MODEL: ${{ vars.SOULKEY_GEMINI_MODEL || 'gemini-2.5-flash' }}
      SOULKEY_BRIDGE_URL: https://soulkey-bridge-214901732194.asia-east1.run.app
    steps:
      - uses: actions/checkout@v4
      - name: Validate worker availability
        shell: bash
        run: |
          python -m py_compile cloud-bridge/translation_worker.py
          python -m py_compile cloud-bridge/nllb_cpu.py
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "::notice::No Gemini API key; using offline NLLB INT8 CPU draft translation."
          fi
      - name: Install offline NLLB runtime if Gemini API is absent
        if: ${{ env.GEMINI_API_KEY == '' }}
        shell: bash
        run: |
          python -m pip install -q "ctranslate2>=4.6,<5" "sentencepiece>=0.2,<1" "huggingface_hub>=0.30,<2"
      - name: Claim one queued translation and process
        shell: bash
        run: python -u cloud-bridge/translation_worker.py

  capture-cc:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SOULKEY_BRIDGE_URL: https://soulkey-bridge-214901732194.asia-east1.run.app
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Kaggle CPU CC runner and source subtitle reader
        run: python -m pip install -q "kaggle>=1.7" "yt-dlp>=2025.1"
      - name: Claim one CC job and store source-bound captions
        run: python -u cloud-bridge/youtube_cc_worker.py
