name: SoulKey 255 Resume Once

on:
  workflow_dispatch:
    inputs:
      bridge_url:
        description: Apps Script Web App URL
        required: true
        type: string
      runtime_nonce:
        description: Short-lived SoulKey runtime nonce
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: soulkey-255-resume-once
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: cwlmrcsir/soulkey-gpu-worker

    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

      - name: Prepare authenticated 255 resume worker
        shell: bash
        env:
          JOB_BRIDGE_URL: ${{ inputs.bridge_url }}
          JOB_RUNTIME_NONCE: ${{ inputs.runtime_nonce }}
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-255-resume"
          rm -rf "$DIR"
          mkdir -p "$DIR"

          if kaggle kernels pull "$KAGGLE_KERNEL" -p "$DIR" -m; then
            echo "Pulled existing dedicated GPU worker."
          else
            cat > "$DIR/kernel-metadata.json" <<'JSON'
          {
            "id": "cwlmrcsir/soulkey-gpu-worker",
            "title": "SoulKey GPU Worker",
            "code_file": "soulkey-gpu-worker.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaT4",
            "kernel_sources": ["cwlmrcsir/translate-system"],
            "dataset_sources": [],
            "competition_sources": [],
            "model_sources": []
          }
          JSON
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          d = Path(os.environ["RUNNER_TEMP"]) / "soulkey-255-resume"
          meta_path = d / "kernel-metadata.json"
          meta = json.loads(meta_path.read_text(encoding="utf-8"))
          meta.pop("id_no", None)
          meta.update({
              "id": "cwlmrcsir/soulkey-gpu-worker",
              "title": "SoulKey GPU Worker",
              "code_file": "soulkey-gpu-worker.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_tpu": False,
              "enable_internet": True,
              "machine_shape": "NvidiaTeslaT4",
              "kernel_sources": ["cwlmrcsir/translate-system"],
              "dataset_sources": [],
              "competition_sources": [],
              "model_sources": [],
          })
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2), encoding="utf-8")

          bridge_url = os.environ["JOB_BRIDGE_URL"].strip()
          runtime_nonce = os.environ["JOB_RUNTIME_NONCE"].strip()

          bootstrap = f"""
          import subprocess
          import sys
          from pathlib import Path

          repo = Path("/kaggle/working/SoulKey")
          subprocess.run(
              ["git", "clone", "--depth", "1",
               "https://github.com/staney41011/SoulKey.git", str(repo)],
              check=True,
          )

          cmd = [
              sys.executable,
              str(repo / "translation-system" / "web_job_worker.py"),
              "--task-id", "P255-L01",
              "--stage", "batch",
              "--langs", "P255-L01,P255-L02",
              "--bridge-url", {bridge_url!r},
              "--runtime-nonce", {runtime_nonce!r},
          ]
          subprocess.run(cmd, check=True)
          """
          (d / meta["code_file"]).write_text(bootstrap, encoding="utf-8")
          print("Prepared authenticated Bridge batch resume for P255-L01,P255-L02")
          PY

      - name: Launch Kaggle checkpoint resume
        id: kaggle
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-255-resume"
          kaggle kernels push -p "$DIR" --accelerator NvidiaTeslaT4 -t 14400

          FINAL_STATUS="UNKNOWN"
          for i in $(seq 1 1440); do
            STATUS="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1 || true)"
            echo "$STATUS"

            if echo "$STATUS" | grep -Eqi 'complete|completed'; then
              FINAL_STATUS="COMPLETE"
              break
            fi

            if echo "$STATUS" | grep -Eqi 'error|failed|failure|cancel'; then
              FINAL_STATUS="ERROR"
              break
            fi

            if (( i % 3 == 0 )); then
              LIVE_LOG="$(timeout 60s kaggle kernels logs "$KAGGLE_KERNEL" 2>&1 || true)"
              if echo "$LIVE_LOG" | grep -q '\[WEB-WORKER ERROR\]'; then
                FINAL_STATUS="ERROR"
                break
              fi
            fi

            sleep 10
          done

          echo "final_status=$FINAL_STATUS" >> "$GITHUB_OUTPUT"

      - name: Show Kaggle log tail
        if: always()
        shell: bash
        run: |
          timeout 90s kaggle kernels logs "$KAGGLE_KERNEL" >"${RUNNER_TEMP}/p255-kaggle.log" 2>&1 || true
          tail -n 240 "${RUNNER_TEMP}/p255-kaggle.log" || true

      - name: Verify 255 resume
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.kaggle.outputs.final_status }}" != "COMPLETE" ]; then
            echo "P255 resume did not complete: ${{ steps.kaggle.outputs.final_status }}"
            exit 1
          fi
          echo "P255 resume completed."
