name: SoulKey Studio Status and TTS Share Tests

on:
  pull_request:
    paths:
      - studio/app-20260923-48.js
      - studio/tts-share-message.js
      - studio/language-delivery.js
      - studio/tests/test_language_delivery_layout.cjs
      - studio/tests/test_tts_share_message.cjs
      - studio/tests/test_english_draft_save_receipt.cjs
      - studio/tests/test_english_drive_authority.cjs
      - studio/tests/test_english_independent_store.cjs
      - studio/tests/test_review_audio_backend.cjs
      - studio/styles.css
      - studio/native-pipeline.js
      - studio/tests/test_p261_native_integration.cjs
      - studio/tests/test_p261_english_missing_source.cjs
      - bridge/apps-script/NativeStudio.gs
      - bridge/apps-script/test_native_studio_gate.js
      - bridge/apps-script/test_unverified_draft_artifacts.js
      - bridge/apps-script/test_unverified_audio_import.js
      - bridge/apps-script/NativePlayback.gs
      - bridge/apps-script/NativeAudio.gs
      - bridge/apps-script/test_classroom_playback_copy.js
      - bridge/apps-script/test_apps_script_load_order.js
      - studio/index.html
      - studio/tests/test_status_batch_all_periods.cjs
      - .github/workflows/studio_status_batch_test.yml
  push:
    branches: [main]
    paths:
      - studio/app-20260923-48.js
      - studio/tts-share-message.js
      - studio/language-delivery.js
      - studio/tests/test_language_delivery_layout.cjs
      - studio/tests/test_tts_share_message.cjs
      - studio/tests/test_english_draft_save_receipt.cjs
      - studio/tests/test_english_drive_authority.cjs
      - studio/tests/test_english_independent_store.cjs
      - studio/tests/test_review_audio_backend.cjs
      - studio/styles.css
      - studio/native-pipeline.js
      - studio/tests/test_p261_native_integration.cjs
      - studio/tests/test_p261_english_missing_source.cjs
      - bridge/apps-script/NativeStudio.gs
      - bridge/apps-script/test_native_studio_gate.js
      - bridge/apps-script/test_unverified_draft_artifacts.js
      - bridge/apps-script/test_unverified_audio_import.js
      - bridge/apps-script/NativePlayback.gs
      - bridge/apps-script/NativeAudio.gs
      - bridge/apps-script/test_classroom_playback_copy.js
      - bridge/apps-script/test_apps_script_load_order.js
      - studio/index.html
      - studio/tests/test_status_batch_all_periods.cjs
      - .github/workflows/studio_status_batch_test.yml

permissions:
  contents: read

jobs:
  validate-studio-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate production browser JS syntax
        run: |
          node --check studio/app-20260923-48.js
          node --check studio/native-pipeline.js
          node --check studio/tts-share-message.js
          node --check studio/language-delivery.js
      - name: Verify TTS share message includes only valid Drive audio
        run: |
          node studio/tests/test_tts_share_message.cjs
          node studio/tests/test_english_draft_save_receipt.cjs
          node studio/tests/test_english_drive_authority.cjs
          node studio/tests/test_english_independent_store.cjs
          node studio/tests/test_review_audio_backend.cjs
          node studio/tests/test_language_delivery_layout.cjs
          node studio/tests/test_p261_native_integration.cjs
          node studio/tests/test_p261_english_missing_source.cjs
          node bridge/apps-script/test_native_studio_gate.js
          node bridge/apps-script/test_unverified_draft_artifacts.js
          node bridge/apps-script/test_unverified_audio_import.js
          node bridge/apps-script/test_classroom_playback_copy.js
          node bridge/apps-script/test_apps_script_load_order.js
      - name: Verify all lessons receive status refresh
        run: node studio/tests/test_status_batch_all_periods.cjs
      - name: Confirm HTML cache-bust deploys corrected script
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("studio/index.html").read_text(encoding="utf-8")
          import re
          assert "app-20260923-48.js?v=20261110-p261-english-source-fallback" in html
          assert "native-pipeline.js?v=20261108-classroom-playback" in html
          assert "tts-share-message.js?v=20261020-review-preview-v2" in html
          assert "id=\"tts-share-copy\"" in html
          assert (html.index("tts-share-message.js?v=") <
                  html.index("language-delivery.js?v=") <
                  html.index("native-pipeline.js?v=") <
                  html.index("app-20260923-48.js?v="))
          print("STUDIO_SCRIPT_CACHE_VERSION_OK")
          PY
