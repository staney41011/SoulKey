name: P259 L04 Vietnamese timeline-aligned Edge TTS pilot (artifact only)
on:
  push:
    branches: [delivery/p259-gemma4-recovery-20261101]
    paths: [.github/workflows/p259_edge_timeline_pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  l04-vi-aligned-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Edge TTS and Drive reader (no Gemini, no GCP)
        run: |
          python -m pip install -q edge-tts==7.3.1 gdown
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify source fingerprint and synthesize segment-aligned audio
        run: |
          python translation-system/p259_edge_timeline_aligned_pilot.py
      - name: Preserve QA receipt and pilot MP3 (not formal delivery)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p259-L04-vi-aligned-edge-pilot-AI-QA-only
          path: |
            p259-aligned-pilot/timeline_qa.json
            p259-aligned-pilot/L04_vi_timeline_aligned_AI_QA_ONLY.mp3
          if-no-files-found: warn
          retention-days: 7
