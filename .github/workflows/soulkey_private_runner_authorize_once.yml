name: One-time SoulKey private runner authorization
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install private TTS credential via signed Apps Script gateway
        shell: bash
        env:
          BRIDGE_URL: https://script.google.com/macros/s/AKfycbyyMjEUqDdhsXWwCWKRTjpyhzdrdXnKhJYZIyiQ-QblOR_nhUdxtv9tqujw5VHkbyZ3/exec
          AUDIO_KEY: ${{ secrets.SOULKEY_AUDIO_RECONCILE_KEY }}
          PRIVATE_TOKEN: ${{ secrets.SOULKEY_PRIVATE_RUNNER_TOKEN_BOOTSTRAP }}
        run: |
          set -euo pipefail
          if [[ -z "$AUDIO_KEY" || -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::Missing signed bridge or private repository credential"
            exit 1
          fi
          response="$RUNNER_TEMP/soulkey-private-auth-result.json"
          curl --fail --silent --show-error --location --max-time 100 \
            --data-urlencode "action=private_runner_auth_once" \
            --data-urlencode "audio_key=$AUDIO_KEY" \
            --data-urlencode "private_token=$PRIVATE_TOKEN" \
            --output "$response" "$BRIDGE_URL"
          AUTH_RESPONSE="$response" python - <<'PY'
          import json,os
          with open(os.environ["AUTH_RESPONSE"],encoding="utf8") as f:
            payload=json.load(f)
          if not payload.get("ok") or not payload.get("installed"):
            raise SystemExit("Private Runner authorization was not accepted: "+
                             str(payload.get("error") or "unknown"))
          print("PRIVATE_RUNNER_AUTH_INSTALLED verified_private_repo_access=true")
          PY
