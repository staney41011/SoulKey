name: P259 current-source five language Edge TTS repair (no GCP)
on:
  push:
    branches: [delivery/p259-gemma4-recovery-20261101]
    paths: [.github/workflows/p259_legacy_revision_audio_only_20261101.yml]
permissions:
  contents: read
  actions: read
jobs:
  audio-only:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { lesson: L01, lang: hi }
          - { lesson: L01, lang: ta }
          - { lesson: L02, lang: hi }
          - { lesson: L02, lang: ta }
          - { lesson: L03, lang: hi }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: p259-${{ matrix.lesson }}-${{ matrix.lang }}-gemma4-revision-refresh
          run-id: 41225772827
          github-token: ${{ github.token }}
          path: artifact-in
      - name: Install validated offline-text audio-only runtime
        run: |
          python -m py_compile translation-system/p259_edge_audio_from_artifact.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q gdown edge-tts==7.2.8
      - name: Verify current English source and completed Gemma QA; synthesize only
        run: |
          python -u translation-system/p259_edge_audio_from_artifact.py --lesson ${{ matrix.lesson }} --lang ${{ matrix.lang }} --artifact-dir artifact-in
      - name: Preserve reviewer-labelled output without promoting human approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p259-${{ matrix.lesson }}-${{ matrix.lang }}-EdgeTTS-revision-refresh
          path: audio-only-output/${{ matrix.lesson }}/${{ matrix.lang }}/*
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
