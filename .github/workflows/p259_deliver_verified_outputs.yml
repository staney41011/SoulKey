name: P259 Deliver All Verified Manuscripts and Natural TTS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p259_deliver_verified_outputs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soulkey-p259-deliver-verified-audio
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      SOULKEY_TTS_PARALLEL_BLOCKS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Validate protected Google authorization and code
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile translation-system/central_tts_source.py translation-system/central_tts_recovery.py translation-system/central_manuscript_export.py
          for label in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            if [[ -z "${!label}" ]]; then
              echo "::error::Missing protected Google OAuth secret: $label; stopping before touching source files"
              exit 1
            fi
            echo "::add-mask::${!label}"
          done
      - name: Install verified Natural TTS CPU engine
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -q \
            -r translation-system/requirements-gemini.txt \
            google-auth-oauthlib 'edge-tts==7.3.1'
      - name: Publish every current-revision QA-passed transcript and verified audio
        shell: bash
        env:
          SOULKEY_TTS_WORKDIR: ${{ runner.temp }}/soulkey-p259-delivery
        run: |
          set -o pipefail
          python -u translation-system/central_tts_recovery.py \
            --period 259 --max-languages 64 \
            2>&1 | tee "$RUNNER_TEMP/p259-delivery.log"
      - name: Preserve non-secret delivery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p259-delivery-receipts-${{ github.run_id }}
          path: ${{ runner.temp }}/p259-delivery.log
          if-no-files-found: ignore
          retention-days: 14
