name: SoulKey Gemini Persistent Code Test

on:
  push:
    paths:
      - ".github/workflows/soulkey_gemini_persistent_code_test.yml"
      - "translation-system/gemini_full_lesson_shadow.py"
      - "translation-system/gemini_checkpoint.py"
      - "translation-system/lesson_paths.py"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          python -m pip install -q google-genai google-api-python-client google-auth google-auth-httplib2

      - name: Compile new modules
        run: |
          python -m py_compile             translation-system/lesson_paths.py             translation-system/gemini_checkpoint.py             translation-system/gemini_full_lesson_shadow.py

      - name: Live Gemini structured-output smoke
        working-directory: translation-system
        run: |
          python - <<'PY'
          import os
          from google import genai
          from google.genai import types
          import gemini_full_lesson_shadow as shadow

          key = os.environ.get("GEMINI_API_KEY", "").strip()
          assert key, "Repository secret GEMINI_API_KEY is missing"

          client = genai.Client(api_key=key)
          prompt = """
          Translate the English sentence into all six languages.
          segment_id is the source segment number and id means Indonesian.
          SOURCE: [{"segment_id": 1, "english": "Kindness begins with understanding."}]
          """

          response = client.models.generate_content(
              model="gemini-3.1-flash-lite",
              contents=prompt,
              config=types.GenerateContentConfig(
                  temperature=0.1,
                  response_mime_type="application/json",
                  response_schema=shadow.TRANSLATION_SCHEMA,
              ),
          )

          payload = response.parsed
          if hasattr(payload, "model_dump"):
              payload = payload.model_dump()
          if not isinstance(payload, dict):
              import json
              payload = json.loads(response.text)

          rows = payload.get("segments") or []
          assert len(rows) == 1, payload
          row = rows[0]
          assert int(row["segment_id"]) == 1, row
          for lang in shadow.LANGS:
              assert str(row.get(lang) or "").strip(), (lang, row)

          print("LIVE STRUCTURED OUTPUT: PASS")
          PY

      - name: Checkpoint selection logic
        working-directory: translation-system
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          import gemini_checkpoint as cp

          tmp = Path(tempfile.mkdtemp())

          original_github = cp.load_github_checkpoint
          original_drive = cp.load_drive_checkpoint

          try:
              cp.load_github_checkpoint = lambda task_id: {
                  "checkpoint_seq": 3,
                  "updated_at": "2026-09-26T00:00:00+00:00",
                  "source": "github"
              }
              cp.load_drive_checkpoint = lambda drive, folder, workdir: {
                  "checkpoint_seq": 5,
                  "updated_at": "2026-09-26T00:01:00+00:00",
                  "source": "drive"
              }

              payload, source = cp.load_persistent_checkpoint(
                  "P254-L03",
                  drive=object(),
                  translation_folder_id="fake-folder",
                  workdir=tmp,
              )

              assert source == "drive", (source, payload)
              assert int(payload["checkpoint_seq"]) == 5, payload

              print("NEWEST CHECKPOINT SELECTION: PASS")
          finally:
              cp.load_github_checkpoint = original_github
              cp.load_drive_checkpoint = original_drive
          PY
