name: P259 Secure Gemma4 Relay Static Check

on:
  push:
    branches: [main]
    paths:
      - 'cloud-bridge/p259_gemma4_relay.py'
      - '.github/workflows/soulkey_translation_queue.yml'
      - '.github/workflows/p259_gemma4_relay_check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile source and verify fully private Kaggle payload
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile cloud-bridge/p259_gemma4_relay.py cloud-bridge/translation_worker.py translation-system/p259_gemma4_kaggle.py
          python translation-system/p259_gemma4_kaggle.py --self-test
          python - <<'PY'
          import sys,json,shutil
          from pathlib import Path
          sys.path.insert(0,"cloud-bridge")
          import p259_gemma4_relay as m
          assert m.KERNEL.startswith("cwlmrcsir/")
          assert m.QA_COMPAT_MODEL.startswith("gemini-compat-gemma4-")
          work=m.private_kernel({"task_id":"P259-L01","revision":"demo","segments":[],"langs":[]})
          metadata=json.loads((work/"kernel-metadata.json").read_text())
          source=(work/"p259_gemma_private.py").read_text()
          assert metadata["is_private"] and metadata["enable_gpu"]
          assert metadata["model_sources"] == []
          assert "GOOGLE_REFRESH_TOKEN" not in source and "KAGGLE_API_TOKEN" not in source
          assert "p259_gemma4_result.json" in source
          compile(source,str(work/"p259_gemma_private.py"),"exec")
          shutil.rmtree(work)
          print("P259_GEMMA4_PRIVATE_RELAY_STATIC_CHECK_OK")
          PY
