name: SoulKey English Final Audio Dispatch

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: P261+ lesson with approved English Final
        required: true
        type: string
        default: P261-L01

permissions:
  contents: read

concurrency:
  group: soulkey-english-final-audio-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enqueue only English Final TTS using signed Bridge
        shell: bash
        env:
          AUDIO_KEY: ${{ secrets.SOULKEY_AUDIO_RECONCILE_KEY }}
          TASK_ID: ${{ inputs.task_id }}
          BRIDGE_URL: https://script.google.com/macros/s/AKfycbyyMjEUqDdhsXWwCWKRTjpyhzdrdXnKhJYZIyiQ-QblOR_nhUdxtv9tqujw5VHkbyZ3/exec
        run: |
          set -euo pipefail
          [[ "$TASK_ID" =~ ^P[0-9]+-L[0-9]+$ ]] || { echo "::error::Invalid lesson ID"; exit 1; }
          [[ -n "$AUDIO_KEY" ]] || { echo "::error::Missing authorization secret"; exit 1; }
          HEALTH_FILE="${RUNNER_TEMP}/soulkey-english-audio-health.json"
          HTTP_CODE="$(curl --location --silent --show-error --max-time 18 --output "$HEALTH_FILE" --write-out '%{http_code}' "$BRIDGE_URL?action=bridge_preflight" || true)"
          if [[ "$HTTP_CODE" != "200" ]] || ! grep -q '"bridge-ready"' "$HEALTH_FILE"; then
            echo "::error::SoulKey Bridge unavailable (HTTP $HTTP_CODE or Google sign-in response)"
            exit 1
          fi
          # The POST only queues one nonce-authorized production TTS job;
          # never retry a POST unless the server explicitly reports failure.
          RESPONSE="$(curl -fsSL --max-time 80 \
            --data-urlencode "action=audio_reconcile" \
            --data-urlencode "audio_key=$AUDIO_KEY" \
            --data-urlencode "english_audio_task=$TASK_ID" \
            "$BRIDGE_URL")"
          RESULT="$RESPONSE" python - <<'PY'
          import json,os
          data=json.loads(os.environ["RESULT"])
          report={k:data.get(k) for k in (
              "ok","task_id","stage","langs","queued","duplicate",
              "workflow_run_id","error")}
          print("ENGLISH_AUDIO_DISPATCH="+str(report))
          if not (data.get("ok") and data.get("task_id")==os.environ["TASK_ID"]
                  and data.get("stage")=="tts" and data.get("langs")=="en"
                  and (data.get("queued") or data.get("duplicate"))):
              raise SystemExit("Approved English audio was not accepted for dispatch")
          PY
