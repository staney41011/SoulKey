name: SoulKey Kaggle checkpoint diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/soulkey_kaggle_checkpoint_diagnostics.yml'
      - 'translation-system/kaggle_checkpoint_summary.py'
  pull_request:
    paths:
      - '.github/workflows/soulkey_kaggle_checkpoint_diagnostics.yml'
      - 'translation-system/kaggle_checkpoint_summary.py'
      - 'translation-system/tests/test_kaggle_checkpoint_summary.py'
  workflow_run:
    workflows: ['Kaggle Web Job']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python translation-system/tests/test_kaggle_checkpoint_summary.py
  inspect:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python -m pip install -q kaggle
      - name: Read allowlisted latest private-kernel progress
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: python translation-system/kaggle_checkpoint_summary.py
