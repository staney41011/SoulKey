name: P259 Edge TTS 7.3.1 compatibility fix verification
on:
  push:
    branches: [delivery/p259-gemma4-recovery-20261101]
    paths: [.github/workflows/p259_edge_tts_731_smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edge-v2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install modern Edge TTS and ffprobe
        run: |
          python -m pip install -q edge-tts==7.3.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate real multilingual MP3 without Gemini
        run: |
          python - <<'PY'
          import asyncio,edge_tts,os,subprocess
          print("EDGE_TTS_VERSION",__import__('importlib').metadata.version("edge-tts"),flush=True)
          tests=[("it-IT-DiegoNeural","Una buona azione può nascere da un pensiero gentile.","italian"),
                 ("km-KH-PisethNeural","គំនិតល្អមួយអាចនាំឱ្យមានអំពើល្អមួយ។","khmer")]
          async def main():
              for voice,txt,lang in tests:
                  path=lang+".mp3"
                  await asyncio.wait_for(edge_tts.Communicate(txt,voice).save(path),timeout=40)
                  size=os.path.getsize(path)
                  dur=subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","default=noprint_wrappers=1:nokey=1",path],text=True).strip()
                  print("EDGE_731_OK",lang,voice,"bytes",size,"duration",dur,flush=True)
                  if size<2000:raise ValueError("SMALL_FILE")
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p259-edge-tts-731-smoke
          path: '*.mp3'
          if-no-files-found: warn
          retention-days: 3
