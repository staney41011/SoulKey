name: P259 Gemma4 Bridge Integration Check

on:
  push:
    branches: [main]
    paths:
      - 'translation-system/p259_gemma4_kaggle.py'
      - 'translation-system/test_p259_gemma4_repair.py'
      - 'translation-system/web_job_worker.py'
      - 'translation-system/tests/test_kaggle_gemma_runtime.py'
      - '.github/workflows/kaggle_web_job.yml'
      - '.github/workflows/p259_gemma4_bridge_check.yml'
  pull_request:
    paths:
      - 'translation-system/p259_gemma4_kaggle.py'
      - 'translation-system/web_job_worker.py'
      - 'translation-system/tests/test_kaggle_gemma_runtime.py'
      - '.github/workflows/kaggle_web_job.yml'
      - '.github/workflows/p259_gemma4_bridge_check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compile runtime and test Gemma4 pure functions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile translation-system/p259_gemma4_kaggle.py translation-system/web_job_worker.py translation-system/google_io.py
          python translation-system/p259_gemma4_kaggle.py --self-test
          python translation-system/test_p259_gemma4_repair.py
          python translation-system/tests/test_kaggle_gemma_runtime.py
      - name: Check auth bridge routing and GPU metadata consistency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          web=Path("translation-system/web_job_worker.py").read_text()
          wf=Path(".github/workflows/kaggle_web_job.yml").read_text()
          gem=Path("translation-system/p259_gemma4_kaggle.py").read_text()
          start=web.index('elif args.stage == "multi" and central_p259:')
          end=web.index('elif args.stage == "multi":',start)
          scoped=web[start:end]
          assert 'GOOGLE_ACCESS_TOKEN' in web and 'SOULKEY_RUNTIME_NONCE' in web
          assert 'p259_gemma4_kaggle.py' in scoped
          assert 'central_tts_recovery.py' in scoped
          assert 'gemini_multi_production_runner.py' not in scoped
          assert 'require_gpu_runtime("gemma4")' in scoped
          assert 'p259_gemma4 = (stage == "multi"' in wf
          assert 'meta["model_sources"] = []' in wf
          assert 'huggingface_hub' in scoped and '--langs' in scoped
          assert 'Gemini API' not in scoped or 'No Kaggle Secrets' in scoped
          print("P259_GEMMA4_BRIDGE_INTEGRATION_CHECK_OK")
          PY
