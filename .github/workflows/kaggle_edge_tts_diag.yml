name: Kaggle Edge TTS Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: cwlmrcsir/soulkey-edge-natural-smoke
    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install -q kaggle
      - name: Inspect kernel
        shell: bash
        run: |
          set +e
          echo "===== STATUS ====="
          kaggle kernels status "$KAGGLE_KERNEL"
          echo "===== LOG TAIL ====="
          timeout 60s kaggle kernels logs "$KAGGLE_KERNEL" | tail -n 220
          exit 0
