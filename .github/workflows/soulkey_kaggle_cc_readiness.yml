name: SoulKey Kaggle CC Readiness

on:
  push:
    paths:
      - ".github/workflows/soulkey_kaggle_cc_readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - name: Check Kaggle job credentials without exposing token
        shell: bash
        run: |
          if [[ -z "$KAGGLE_API_TOKEN" ]]; then
            echo "KAGGLE_AUTH_CONFIGURED=false"
            exit 0
          fi
          echo "KAGGLE_AUTH_CONFIGURED=true"
          python -m pip install -q kaggle
          kaggle kernels list --user cwlmrcsir -p 1 >/dev/null
          echo "KAGGLE_AUTH_WORKING=true"
