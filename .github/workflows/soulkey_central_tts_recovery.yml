name: SoulKey Central Final -> Legacy Natural TTS Recovery

on:
  workflow_dispatch:
  schedule:
    # CPU only. Never dispatch before the owner Google Drive credentials
    # have been configured and the one-time readiness switch is enabled.
    - cron: '17 */3 * * *'

permissions:
  contents: read

concurrency:
  group: soulkey-central-natural-tts-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SOULKEY_TTS_DRIVE_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      SOULKEY_TTS_WORKDIR: ${{ runner.temp }}/soulkey-central-tts
      SOULKEY_TTS_PARALLEL_BLOCKS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Validate code and protected Drive authorization
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile translation-system/central_tts_source.py translation-system/central_tts_recovery.py
          python -m unittest discover -s translation-system/tests -p 'test_central_tts_source.py' -v
          for label in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            if [[ -z "${!label}" ]]; then
              echo "::error::Protected $label is not configured. No TTS/Drive work was started."
              exit 1
            fi
            echo "::add-mask::${!label}"
          done
      - name: Prepare previous Natural TTS CPU engine
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -q \
            -r translation-system/requirements-gemini.txt \
            'google-auth-oauthlib' 'edge-tts==7.3.1'
          ffprobe -version | head -n 1
      - name: Recover one QA-approved language and verify Drive output
        shell: bash
        run: |
          python -u translation-system/central_tts_recovery.py \
            --period 259 --max-languages 1
