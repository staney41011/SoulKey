name: P259 One-Shot Natural TTS Kickstart

# One-time authorized dispatch; use central QA-approved manuscripts only.
on:
  push:
    paths:
      - '.github/workflows/p259_audio_kickstart.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger P259 verified Natural TTS recovery on Kaggle CPU
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run p259_emergency_kaggle_tts.yml --repo "$GH_REPO" --ref main -f max_languages=4
          echo "P259_NATURAL_TTS_DISPATCH_SUBMITTED"
          echo "Only QA-approved language sources can be converted into audio."
