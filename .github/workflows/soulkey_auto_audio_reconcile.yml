name: SoulKey Auto Audio Reconcile

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      sheet_formal_task:
        description: Destination lesson for Google Sheets sourced official audio
        required: false
        type: string
        default: "P260-L04"
      pilot_l04_langs:
        description: Google Sheets sourced official audio language list
        required: false
        type: string
        default: ""
      reset_task:
        description: Requeue a verified-cancelled P260 audio job (optional)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: soulkey-auto-audio-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake authenticated Bridge to resume approved audio
        shell: bash
        env:
          AUDIO_KEY: ${{ secrets.SOULKEY_AUDIO_RECONCILE_KEY }}
          SHEET_FORMAL_TASK: ${{ inputs.sheet_formal_task || 'P260-L04' }}
          PILOT_L04_LANGS: ${{ inputs.pilot_l04_langs || '' }}
          RESET_TASK: ${{ inputs.reset_task || '' }}
          BRIDGE_URL: https://script.google.com/macros/s/AKfycbyyMjEUqDdhsXWwCWKRTjpyhzdrdXnKhJYZIyiQ-QblOR_nhUdxtv9tqujw5VHkbyZ3/exec
        run: |
          set -euo pipefail
          if [[ -z "$AUDIO_KEY" ]]; then
            echo "Audio reconciliation secret is missing"
            exit 1
          fi
          RESPONSE=$(curl -fsSL --retry 2 --max-time 70 \
            --data-urlencode "action=audio_reconcile" \
            --data-urlencode "reset_task=$RESET_TASK" \
            --data-urlencode "sheet_formal_task=$SHEET_FORMAL_TASK" \
            --data-urlencode "pilot_l04_langs=$PILOT_L04_LANGS" \
            --data-urlencode "audio_key=$AUDIO_KEY" \
            "$BRIDGE_URL")
          RESULT="$RESPONSE" python - <<'PY'
          import json,os
          value=json.loads(os.environ["RESULT"])
          if not value.get("ok"):
              raise SystemExit("Bridge audio reconciliation failed: "+str(value.get("reason") or value.get("error")))
          print("AUDIO_RECONCILE_OK task="+str(value.get("task_id") or "none")+
                " languages="+str(value.get("langs") or "none")+
                " queued="+str(bool(value.get("task_id"))))
          PY
