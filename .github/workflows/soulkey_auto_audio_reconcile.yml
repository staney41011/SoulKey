name: SoulKey Auto Audio Reconcile

on:
  # Native Apps Script triggers own recurring P262+ processing.
  # This external bridge is retained for explicit manual recovery only.
  workflow_dispatch:
    inputs:
      sheet_formal_task:
        description: Destination lesson for Google Sheets sourced official audio
        required: false
        type: string
        default: "P260-L04"
      pilot_l04_langs:
        description: Google Sheets sourced official audio language list
        required: false
        type: string
        default: ""
      reset_task:
        description: Requeue a verified-cancelled P260 audio job (optional)
        type: string
        required: false
        default: ""
      native_audio_task:
        description: Signed 261+ lesson for targeted audio import/copy
        type: string
        required: false
        default: ""
      native_audio_lang:
        description: Single selected language code
        type: string
        required: false
        default: ""
      native_sheets_action:
        description: Signed native Sheets recovery (status/install/tick/repair_p262_l02)
        type: string
        required: false
        default: ""
      native_sheets_task:
        description: Target lesson for one translation batch (e.g. P262-L01)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: soulkey-auto-audio-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wake authenticated Bridge to resume approved audio
        shell: bash
        env:
          AUDIO_KEY: ${{ secrets.SOULKEY_AUDIO_RECONCILE_KEY }}
          SHEET_FORMAL_TASK: ${{ inputs.sheet_formal_task || 'P260-L04' }}
          PILOT_L04_LANGS: ${{ inputs.pilot_l04_langs || '' }}
          RESET_TASK: ${{ inputs.reset_task || '' }}
          NATIVE_TASK: ${{ inputs.native_audio_task || '' }}
          NATIVE_LANG: ${{ inputs.native_audio_lang || '' }}
          NATIVE_SHEETS_ACTION: ${{ inputs.native_sheets_action || '' }}
          NATIVE_SHEETS_TASK: ${{ inputs.native_sheets_task || '' }}
          BRIDGE_URL: https://script.google.com/macros/s/AKfycbyyMjEUqDdhsXWwCWKRTjpyhzdrdXnKhJYZIyiQ-QblOR_nhUdxtv9tqujw5VHkbyZ3/exec
        run: |
          set -euo pipefail
          if [[ -z "$AUDIO_KEY" ]]; then
            echo "Audio reconciliation secret is missing"
            exit 1
          fi
          HEALTH_FILE="${RUNNER_TEMP}/soulkey-bridge-health.json"
          HEALTH_CODE="$(curl --location --silent --show-error --max-time 18 --output "$HEALTH_FILE" --write-out '%{http_code}' "$BRIDGE_URL?action=bridge_preflight" || true)"
          if [[ "$HEALTH_CODE" != 200 ]] || ! grep -q '"bridge-ready"' "$HEALTH_FILE" 2>/dev/null; then
            echo "::error title=SoulKey Bridge unavailable::Apps Script gateway is not publicly reachable (HTTP $HEALTH_CODE or sign-in page). Dispatch skipped. Verify effective Google Web App authorization; do not retry the same inaccessible URL."
            exit 1
          fi
          # POST may already dispatch jobs while the client waits. Never retry
          # a timed-out non-idempotent reconciliation request: doing so can
          # queue overlapping jobs and magnify Drive/Apps Script load.
          # Allow one longer response window; subsequent cron runs use server
          # leases and source manifests to resume only incomplete work.
          RESPONSE=$(curl -fsSL --max-time 300 \
            --data-urlencode "action=audio_reconcile" \
            --data-urlencode "reset_task=$RESET_TASK" \
            --data-urlencode "native_audio_task=$NATIVE_TASK" \
            --data-urlencode "native_audio_lang=$NATIVE_LANG" \
            --data-urlencode "native_sheets_action=$NATIVE_SHEETS_ACTION" \
            --data-urlencode "native_sheets_task=$NATIVE_SHEETS_TASK" \
            --data-urlencode "sheet_formal_task=$SHEET_FORMAL_TASK" \
            --data-urlencode "pilot_l04_langs=$PILOT_L04_LANGS" \
            --data-urlencode "audio_key=$AUDIO_KEY" \
            "$BRIDGE_URL")
          RESULT="$RESPONSE" python - <<'PY'
          import json,os
          value=json.loads(os.environ["RESULT"])
          if value.get("stage")=="native_sheets":
              status=value.get("status") or {}
              details=value.get("result") or {}
              safe={k:status.get(k) for k in ("enabled","trigger_count",
                   "qa_trigger_count","audio_trigger_count","coordinator_trigger_count","coordinator_phase",
                   "registered_lessons","jobs","health") if k in status}
              print("NATIVE_SHEETS_STATUS "+json.dumps({
                  "ok":value.get("ok"),"mode":value.get("mode"),
                  "reason":value.get("reason"),"status":safe,
                  "diagnostics":value.get("diagnostics",[]),
                  "result":{k:details.get(k) for k in
                    ("ok","reason","note","lessons","active_lessons",
                     "seeded","requests","translated","failed",
                     "exported_languages","quota_used")
                    if k in details}},ensure_ascii=False))
              if not value.get("ok"):
                  raise SystemExit("Native Sheets action failed: "+
                                   str(value.get("reason") or "unknown"))
              raise SystemExit(0)
          if not value.get("ok"):
              raise SystemExit("Bridge audio reconciliation failed: "+str(value.get("reason") or value.get("error")))
          if value.get("stage")=="native_audio":
              safe={k:value.get(k) for k in
                  ("ok","task_id","language","reason","imported","queued",
                   "classroom_playback","status") if k in value}
              print("FOCUSED_NATIVE_AUDIO "+json.dumps(safe,ensure_ascii=False))
              raise SystemExit(0)
          print("AUDIO_RECONCILE_OK task="+str(value.get("task_id") or "none")+
                " languages="+str(value.get("langs") or "none")+
                " queued="+str(bool(value.get("task_id"))))
          # This separate result diagnoses native P261+ TTS and classroom copies.
          # Do not print credentials, URLs, text contents or raw worker payloads.
          native=value.get("native_audio") or {}
          safe={k:native.get(k) for k in
              ("ok","reason","task","lang","queued","imported","status","classroom_playback")
              if k in native}
          print("NATIVE_AUDIO_RESULT "+json.dumps(safe,ensure_ascii=False))
          if native and not native.get("ok",True):
              print("::warning title=Native audio requires recovery::"+
                  str(native.get("reason") or "native_audio_failed")[:150])
          PY
