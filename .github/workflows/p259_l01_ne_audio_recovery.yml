name: P259 L01 Nepali Edge audio recovery
on:
  push:
    branches: [delivery/p259-gemma4-recovery-20261101]
    paths: [.github/workflows/p259_l01_ne_audio_recovery.yml]
permissions:
  contents: read
jobs:
  nepali:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Edge runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q gdown edge-tts==7.2.8
      - name: Create full Nepali audio from 59 verified draft passages
        run: |
          python -u translation-system/p259_edge_audio_from_drive.py --lesson L01 --lang ne --file-id 1vC2ys-aDoB41l22NIBdT4myQEIyAdb9T
      - name: Preserve TTS output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p259-L01-ne-EdgeTTS-msedgeservices
          path: |
            audio-only-output/L01/ne/*.mp3
            audio-only-output/L01/ne/*驗收報告.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
