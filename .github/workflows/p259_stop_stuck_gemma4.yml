name: P259 Stop Stuck Legacy Gemma4 Dispatch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p259_stop_stuck_gemma4.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel authenticated relay poll stuck on incorrect Kaggle kernel slug
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GH_REPO/actions/runs/41037581687/cancel"
          echo "P259_STUCK_RELAY_CANCEL_REQUESTED"
