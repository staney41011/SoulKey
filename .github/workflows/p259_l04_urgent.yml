name: P259-L04 urgent six-language recovery
on:
  pull_request:
    paths:
      - '.github/workflows/p259_l04_urgent.yml'
      - 'translation-system/p259_l04_urgent*.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p259_l04_urgent.yml'
permissions:
  contents: read
concurrency:
  group: soulkey-p259-l04-urgent
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check source code and protected authorizations (never print secrets)
        shell: bash
        run: |
          set -euo pipefail
          for label in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN GEMINI_API_KEY; do
            if [[ -z "${!label}" ]]; then
              echo "::warning::P259_L04_PROTECTED_${label}_MISSING"
            else
              echo "P259_L04_PROTECTED_${label}_CONFIGURED"
            fi
          done
          echo "P259_L04_PREFLIGHT_NO_PRODUCTION_SIDE_EFFECTS"
