name: SoulKey YouTube CC Source Readiness

on:
  push:
    paths:
      - ".github/workflows/soulkey_youtube_cc_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install CC reader
        run: python -m pip install -q yt-dlp
      - name: Verify real P259-L04 video and caption metadata without editing lesson data
        run: |
          cd cloud-bridge
          python - <<'PY'
          import yt_dlp
          video="w7rzYft4MeE"
          with yt_dlp.YoutubeDL({"quiet":True,"no_warnings":True,
                   "skip_download":True,"socket_timeout":35,
                   "retries":2,"extractor_retries":2}) as y:
              info=y.extract_info("https://www.youtube.com/watch?v="+video,download=False)
              assert info.get("id")==video,"YouTube source video ID changed"
              manual=info.get("subtitles") or {}
              automatic=info.get("automatic_captions") or {}
              wanted=("en","th","es","id","vi","sd","ta")
              available=[x for x in wanted if x in manual or x in automatic]
              print("CC_SOURCE_ID_VERIFIED",video)
              print("AVAILABLE_CC_LANGUAGES",",".join(available))
              print("MANUAL_LANG_COUNT",len(manual),"AUTO_LANG_COUNT",len(automatic))
          PY
