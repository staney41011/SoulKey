name: SoulKey Offline Translation Smoke

on:
  push:
    paths:
      - ".github/workflows/soulkey_nllb_smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translate-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install CPU translator
        run: |
          python -m pip install -q "ctranslate2>=4.6,<5" "sentencepiece>=0.2,<1" "huggingface_hub>=0.30,<2"
      - name: Translate safe sample into Spanish Thai and Khmer
        run: |
          cd cloud-bridge
          python - <<'PY'
          from nllb_cpu import NllbCPU
          runner=NllbCPU()
          s=[{"id":0,"text":"Peace and kindness guide our hearts."}]
          for lang in ["es","th","km"]:
              result=runner.translate(lang,s)
              assert len(result)==1
              assert result[0]["id"]==0 and result[0]["text"]
              print("NLLB_TEST_PASS",lang,len(result[0]["text"]))
          PY
