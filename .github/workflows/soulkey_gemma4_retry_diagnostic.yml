name: SoulKey Gemma 4 bounded translation diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/soulkey_gemma4_retry_diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gemma4-single:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Test one production-shaped Gemma 4 response with a longer timeout
        run: |
          python - <<'PY'
          import os,sys,re,time
          sys.path.insert(0,"translation-system")
          from gemini_engine import GeminiClient
          if not os.getenv("GEMINI_API_KEY"):
              raise SystemExit("FAIL:NO_GEMINI_API_KEY")
          client=GeminiClient(max_attempts=1,timeout=95)
          schema={"type":"object","properties":{"segments":{"type":"array","items":{"type":"object","properties":{"segment_id":{"type":"integer"},"ta":{"type":"string"}},"required":["segment_id","ta"]}}},"required":["segments"]}
          prompt=('Translate this English lecture excerpt into natural Tamil. '
                  'Preserve all meaning and the segment ID. Output JSON only. '
                  'SOURCE: [{"segment_id":13,"english":"Everyone, please take your seats."}]')
          start=time.monotonic()
          try:
              payload,_=client.structured(prompt,schema,
                system_instruction="You are a precise multilingual lecture translator.",
                thinking_level="low")
              rows=payload.get("segments") or []
              assert len(rows)==1 and int(rows[0].get("segment_id",-1))==13 and str(rows[0].get("ta") or "").strip(),"INVALID_TRANSLATION"
              print("GEMMA4_DIAGNOSTIC_PASS model=gemma-4-26b-a4b-it seconds="+str(round(time.monotonic()-start,1)))
          except Exception as exc:
              m=re.search(r"HTTP [0-9]{3}",str(exc))
              print("GEMMA4_DIAGNOSTIC_FAIL type="+type(exc).__name__+" http="+(m.group(0) if m else "none")+" seconds="+str(round(time.monotonic()-start,1)))
              raise SystemExit(1)
          PY

      - name: Test real long lecture paragraph with three languages
        run: |
          python - <<'PY'
          import json,os,sys,re,time
          sys.path.insert(0,"translation-system")
          from gemini_engine import GeminiClient
          data=json.load(open("studio-review-cache/P260-L01/en.json",encoding="utf-8"))
          row=next(x for x in data["segments"] if int(x["id"])==396)
          source=str(row["en_text"])
          assert len(source)>700
          schema={"type":"object","properties":{"segments":{"type":"array","items":{"type":"object","properties":{"segment_id":{"type":"integer"},"ta":{"type":"string"},"km":{"type":"string"},"bn":{"type":"string"}},"required":["segment_id","ta","km","bn"]}}},"required":["segments"]}
          client=GeminiClient(max_attempts=1,timeout=95)
          start=time.monotonic()
          try:
              payload,_=client.structured(
                  'Translate the approved English lecture text faithfully to Tamil (ta), Khmer (km), and Bengali (bn). Preserve every idea. Keep segment_id unchanged. SOURCE: '+json.dumps([{"segment_id":396,"english":source}],ensure_ascii=False),
                  schema,system_instruction="Precise lecture translation, do not omit meaning.",
                  thinking_level="low")
              rows=payload.get("segments") or []
              assert len(rows)==1 and int(rows[0].get("segment_id",-1))==396
              assert all(str(rows[0].get(l) or "").strip() for l in ("ta","km","bn"))
              print("GEMMA4_LONG_PASS chars="+str(len(source))+" langs=3 secs="+str(round(time.monotonic()-start,1)))
          except Exception as exc:
              m=re.search(r"HTTP [0-9]{3}",str(exc))
              print("GEMMA4_LONG_FAIL type="+type(exc).__name__+" http="+(m.group(0) if m else "none")+" secs="+str(round(time.monotonic()-start,1)))
              raise SystemExit(1)
          PY
