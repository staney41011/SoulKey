name: Kaggle Web Worker Private Data Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-private-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: cwlmrcsir/soulkey-web-worker
      KAGGLE_TEST_DATASET: cwlmrcsir/soulkey-web-secrets-test

    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

      - name: Create or refresh private test dataset
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-web-secrets-test"
          mkdir -p "$DIR"

          cat > "$DIR/secret_test.json" <<'JSON'
          {"SOULKEY_WEB_TEST":"ok"}
          JSON

          cat > "$DIR/dataset-metadata.json" <<'JSON'
          {
            "title": "SoulKey Web Secrets Test",
            "id": "cwlmrcsir/soulkey-web-secrets-test",
            "licenses": [{"name": "other"}]
          }
          JSON

          if kaggle datasets status "$KAGGLE_TEST_DATASET" >/dev/null 2>&1; then
            kaggle datasets version               -p "$DIR"               -m "Refresh harmless web-worker credential test"               -q -t -r skip -d
          else
            kaggle datasets create -p "$DIR" -q -t -r skip
          fi

          echo "Private test dataset ready: $KAGGLE_TEST_DATASET"

      - name: Pull existing worker
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-web-worker"
          mkdir -p "$DIR"
          kaggle kernels pull "$KAGGLE_KERNEL" -p "$DIR" -m
          cat "$DIR/kernel-metadata.json"

      - name: Attach private dataset and install test code
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-web-worker"

          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "soulkey-web-worker", "kernel-metadata.json")
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          data["enable_internet"] = True
          data["dataset_sources"] = ["cwlmrcsir/soulkey-web-secrets-test"]
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print("dataset_sources =", data["dataset_sources"])
          print("enable_internet =", data["enable_internet"])
          PY

          CODE_FILE="$(python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "soulkey-web-worker", "kernel-metadata.json")
          with open(path, "r", encoding="utf-8") as f:
              print(json.load(f)["code_file"])
          PY
          )"

          cat > "$DIR/$CODE_FILE" <<'PY'
          import json
          from pathlib import Path

          candidates = [
              Path("/kaggle/input/soulkey-web-secrets-test/secret_test.json"),
          ]
          secret_path = next((p for p in candidates if p.exists()), None)
          if secret_path is None:
              raise RuntimeError("Private credential dataset was not mounted")

          data = json.loads(secret_path.read_text(encoding="utf-8"))
          if data.get("SOULKEY_WEB_TEST") != "ok":
              raise RuntimeError("Private credential dataset value is incorrect")

          Path("/kaggle/working/web_worker_private_data_check.txt").write_text(
              "SoulKey private credential dataset OK\n",
              encoding="utf-8",
          )
          print("SoulKey private credential dataset OK")
          PY

      - name: Push worker and start CPU test
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-web-worker"
          kaggle kernels push -p "$DIR" -t 300

      - name: Wait for Kaggle worker
        id: wait_worker
        shell: bash
        run: |
          set -euo pipefail
          FINAL_STATUS="UNKNOWN"

          for i in $(seq 1 60); do
            STATUS="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1 || true)"
            echo "$STATUS"

            if echo "$STATUS" | grep -Eqi 'complete|completed'; then
              FINAL_STATUS="COMPLETE"
              break
            fi

            if echo "$STATUS" | grep -Eqi 'error|failed|failure|cancel'; then
              FINAL_STATUS="ERROR"
              break
            fi

            sleep 5
          done

          echo "final_status=$FINAL_STATUS" >> "$GITHUB_OUTPUT"
          echo "Kaggle final status: $FINAL_STATUS"

      - name: Download Kaggle output and log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/worker-output"
          mkdir -p "$OUT"
          kaggle kernels output "$KAGGLE_KERNEL" -p "$OUT" -o || true
          find "$OUT" -maxdepth 2 -type f -print || true
          LOG="$(find "$OUT" -type f -name '*.log' | head -n 1 || true)"
          if [ -n "$LOG" ]; then
            echo "----- Kaggle log tail -----"
            tail -n 120 "$LOG"
          fi

      - name: Verify private dataset survived API-triggered run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/worker-output"

          if [ "${{ steps.wait_worker.outputs.final_status }}" != "COMPLETE" ]; then
            echo "Kaggle worker ended with status: ${{ steps.wait_worker.outputs.final_status }}"
            exit 1
          fi

          cat "$OUT/web_worker_private_data_check.txt"
          grep -q "SoulKey private credential dataset OK" "$OUT/web_worker_private_data_check.txt"
          echo "API-triggered Kaggle worker can access attached private credential dataset."
