name: Kaggle Web Worker Secret Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-worker-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: cwlmrcsir/soulkey-web-worker

    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

      - name: Pull existing worker
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-web-worker"
          mkdir -p "$DIR"
          kaggle kernels pull "$KAGGLE_KERNEL" -p "$DIR" -m
          ls -la "$DIR"
          cat "$DIR/kernel-metadata.json"

      - name: Replace worker code with Secret check
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-web-worker"

          cat > "$DIR/web_worker.py" <<'PY'
          from pathlib import Path
          from kaggle_secrets import UserSecretsClient

          value = UserSecretsClient().get_secret("SOULKEY_WEB_TEST")
          if value != "ok":
              raise RuntimeError("SOULKEY_WEB_TEST secret is missing or incorrect")

          Path("/kaggle/working/web_worker_secret_check.txt").write_text(
              "SoulKey web worker secret OK\n",
              encoding="utf-8",
          )
          print("SoulKey web worker secret OK")
          PY

      - name: Push worker and start CPU test
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/soulkey-web-worker"
          kaggle kernels push -p "$DIR" -t 300

      - name: Wait for Kaggle worker
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            STATUS="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1 || true)"
            echo "$STATUS"

            if echo "$STATUS" | grep -Eqi 'complete|completed'; then
              exit 0
            fi

            if echo "$STATUS" | grep -Eqi 'error|failed|failure|cancel'; then
              echo "Worker secret test failed."
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for worker secret test."
          exit 1

      - name: Verify secret survived API-triggered run
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/worker-output"
          mkdir -p "$OUT"
          kaggle kernels output "$KAGGLE_KERNEL" -p "$OUT" -o
          cat "$OUT/web_worker_secret_check.txt"
          grep -q "SoulKey web worker secret OK" "$OUT/web_worker_secret_check.txt"
          echo "API-triggered Kaggle worker can access attached secret."
