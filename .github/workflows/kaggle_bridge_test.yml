name: Kaggle Bridge Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-kaggle-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Check secret exists
        shell: bash
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "KAGGLE_API_TOKEN is missing."
            exit 1
          fi
          echo "KAGGLE_API_TOKEN is configured."

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install kaggle

      - name: Show Kaggle CLI version
        run: kaggle --version

      - name: Verify Kaggle authentication
        run: |
          echo "Testing authenticated access to Kaggle..."
          kaggle kernels list --mine --page-size 5
          echo "Kaggle bridge authentication OK."
