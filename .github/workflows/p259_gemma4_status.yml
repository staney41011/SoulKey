name: P259 Gemma4 Secure Relay Runtime Status
# Read-only status inspection after restoring the original Studio workflow.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/p259_gemma4_status.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL: cwlmrcsir/soulkey-p259-gemma4-relay
    steps:
      - name: Check Kaggle Gemma4 worker status and actual kernel logs
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_API_TOKEN" ]] || exit 1
          python -m pip install -q kaggle
          echo "=== P259 GEMMA4 KAGGLE STATUS ==="
          kaggle kernels list --user cwlmrcsir | grep -i -E "gemma4|soulkey" | head -40 || true
          kaggle kernels status "$KERNEL" || true
          kaggle kernels status cwlmrcsir/soulkey-p259-gemma4-private-relay || true
          echo "=== P259 GEMMA4 KAGGLE LOGS ==="
          kaggle kernels logs "$KERNEL" 2>&1 | tail -200 || true
          echo "NOTE: queued/submitted != verified Sheet/Drive delivery."
