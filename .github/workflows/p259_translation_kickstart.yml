name: P259 One-Shot Translation Queue Kickstart

# Dispatch the real worker under its verified workflow_dispatch OIDC event.
# Never permit push-origin JWTs to claim protected Cloud Run jobs.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p259_translation_kickstart.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: soulkey-p259-one-shot-translation-kickstart
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch authorized P259 OIDC-to-Kaggle Gemma4 queue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run soulkey_translation_queue.yml --repo "$GH_REPO" --ref main -f remaining_runs=12
          echo "P259_GEMMA4_DIRECT_JSON_GRAMMAR_BOUNDED_QUEUE_DISPATCH_SUBMITTED"
          echo "P259 Gemma4 local GPU; verify Cloud Run QA receipts and Drive, not green workflow status."
