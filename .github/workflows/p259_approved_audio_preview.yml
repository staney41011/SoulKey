name: P259 Verified Text to Natural Edge Audio Preview Artifacts
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p259_approved_audio_preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        lesson: [P259-L01, P259-L02, P259-L03, P259-L04]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Edge Natural TTS runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -q \
            -r translation-system/requirements-gemini.txt \
            'edge-tts==7.3.1' google-auth-oauthlib
      - name: Render human-final and current-revision QA-approved language previews
        shell: bash
        env:
          LESSON: ${{ matrix.lesson }}
          OUT: ${{ runner.temp }}/p259-natural-preview
        run: |
          set -euo pipefail
          python -u translation-system/p259_offline_tts_artifact.py \
            --lesson "$LESSON" --output "$OUT"
      - name: Preserve previews and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p259-preview-${{ matrix.lesson }}-${{ github.run_id }}
          path: ${{ runner.temp }}/p259-natural-preview/${{ matrix.lesson }}/
          if-no-files-found: error
          retention-days: 30
