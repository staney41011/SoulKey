name: SoulKey Translation Bridge Capability Check
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/soulkey_bridge_translation_capabilities_probe.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live bridge protocol without publishing any job
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.error
          base="https://soulkey-bridge-214901732194.asia-east1.run.app"
          tokenreq=urllib.request.Request(os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]+"&audience=soulkey-bridge",
            headers={"Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          try:
            with urllib.request.urlopen(tokenreq,timeout=20) as r:
              token=json.load(r)["value"]
          except Exception as e:
            print("OIDC_PROBE_NOT_AVAILABLE",type(e).__name__)
            raise
          req=urllib.request.Request(base,method="POST",
            data=b"action=worker_job_quality&job_id=00000000-0000-4000-8000-000000000000&language=xx",
            headers={"Content-Type":"application/x-www-form-urlencoded",
                     "Authorization":"Bearer "+token})
          try:
            with urllib.request.urlopen(req,timeout=30) as r:body=json.load(r)
          except urllib.error.HTTPError as e:
            body=json.load(e);print("LIVE_PROBE_HTTP",e.code)
          kind=str(body.get("type") or "unknown")
          print("LIVE_PROBE_RESPONSE_TYPE",kind)
          print("LIVE_QA_WORKER_ROUTE",("present" if kind=="worker_job_quality" else "not_deployed"))
          PY
