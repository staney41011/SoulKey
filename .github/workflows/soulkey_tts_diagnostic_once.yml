name: SoulKey TTS Diagnostic Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/soulkey_tts_diagnostic_once.yml"

permissions:
  contents: read

concurrency:
  group: soulkey-tts-diagnostic-once
  cancel-in-progress: false

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, 'Run TTS diagnostic once')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KERNEL: cwlmrcsir/soulkey-tts-diagnostic

    steps:
      - name: Install Kaggle CLI
        run: |
          python -m pip install -q kaggle

      - name: Build diagnostic kernel
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/tts-diag"
          rm -rf "$DIR"
          mkdir -p "$DIR"
          cat > "$DIR/kernel-metadata.json" <<'JSON'
          {
            "id": "cwlmrcsir/soulkey-tts-diagnostic",
            "title": "SoulKey TTS Diagnostic",
            "code_file": "diag.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_tpu": false,
            "enable_internet": true,
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "kernel_sources": [],
            "competition_sources": [],
            "model_sources": []
          }
          JSON

          cat > "$DIR/diag.py" <<'PY'
          import os
          import subprocess
          import sys
          import textwrap

          def pip(*args):
              subprocess.run(
                  [sys.executable, "-m", "pip", "install", "-q", *args],
                  check=True,
              )

          def run_probe(label):
              code = r'''
          import json
          import platform
          import sys
          import traceback

          import torch
          import transformers
          from transformers import AutoTokenizer, VitsModel, set_seed

          print("VERSIONS", json.dumps({
              "python": sys.version,
              "torch": torch.__version__,
              "transformers": transformers.__version__,
              "cuda": torch.version.cuda,
              "gpu": torch.cuda.get_device_name(0) if torch.cuda.is_available() else None,
          }), flush=True)

          model_id = "facebook/mms-tts-eng"
          tokenizer = AutoTokenizer.from_pretrained(model_id)
          model = VitsModel.from_pretrained(model_id).to("cuda")
          model.eval()

          samples = [
              "This is a normal sentence for a text to speech test.",
              "Yes.",
              "No.",
              "7.",
              "A.",
              "I",
              ".",
          ]

          for i, text in enumerate(samples):
              try:
                  inputs = tokenizer(text=text, return_tensors="pt")
                  n = int(inputs["input_ids"].shape[-1])
                  print("SAMPLE", repr(text), "tokens=", n,
                        "ids=", inputs["input_ids"].tolist(), flush=True)
                  inputs = {k: v.to("cuda") for k, v in inputs.items()}
                  set_seed(555 + i)
                  with torch.inference_mode():
                      out = model(**inputs).waveform
                  print("OK", repr(text), tuple(out.shape), flush=True)
              except Exception as exc:
                  print("FAIL", repr(text), type(exc).__name__, str(exc), flush=True)
                  traceback.print_exc()
          '''
              print("\n" + "=" * 80, flush=True)
              print("PROBE", label, flush=True)
              print("=" * 80, flush=True)
              subprocess.run([sys.executable, "-c", textwrap.dedent(code)], check=False)

          pip("numpy<2.0", "scipy", "huggingface_hub", "sentencepiece", "transformers")
          run_probe("CURRENT_LATEST")

          pip("--force-reinstall", "transformers==4.57.6")
          run_probe("PINNED_4_57_6")

          # Verify that Meta's legacy MMS fallback files really exist and that
          # the SoulKey vendored converter can at least fetch/parse them.
          print("\n" + "=" * 80, flush=True)
          print("SINDHI_SOURCE_PROBE", flush=True)
          print("=" * 80, flush=True)
          from huggingface_hub import hf_hub_download
          for filename in ["vocab.txt", "config.json", "G_100000.pth"]:
              try:
                  path = hf_hub_download(
                      repo_id="facebook/mms-tts",
                      filename=filename,
                      subfolder="models/snd",
                  )
                  print("SND_OK", filename, path, os.path.getsize(path), flush=True)
              except Exception as exc:
                  print("SND_FAIL", filename, type(exc).__name__, str(exc), flush=True)
          PY

      - name: Launch diagnostic
        id: kaggle
        shell: bash
        run: |
          set -euo pipefail
          DIR="${RUNNER_TEMP}/tts-diag"
          kaggle kernels push -p "$DIR" --accelerator NvidiaTeslaT4 -t 2700
          FINAL="UNKNOWN"
          for i in $(seq 1 180); do
            STATUS="$(kaggle kernels status "$KAGGLE_KERNEL" 2>&1 || true)"
            echo "$STATUS"
            if echo "$STATUS" | grep -Eqi 'complete|completed'; then
              FINAL="COMPLETE"; break
            fi
            if echo "$STATUS" | grep -Eqi 'error|failed|failure|cancel'; then
              FINAL="ERROR"; break
            fi
            sleep 10
          done
          echo "final=$FINAL" >> "$GITHUB_OUTPUT"

      - name: Print diagnostic log
        if: always()
        shell: bash
        run: |
          timeout 90s kaggle kernels logs "$KAGGLE_KERNEL" > "${RUNNER_TEMP}/tts-diag.log" 2>&1 || true
          cat "${RUNNER_TEMP}/tts-diag.log" || true

      - name: Verify diagnostic
        if: always()
        run: |
          test "${{ steps.kaggle.outputs.final }}" = "COMPLETE"
