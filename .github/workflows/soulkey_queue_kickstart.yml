name: SoulKey Queue Recovery Kickstart

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/soulkey_queue_kickstart.yml
  workflow_dispatch:

# This one-shot recovery dispatches the existing idempotent Sheet queues.
# It does not add jobs or edit any manuscript.
permissions:
  actions: write
  contents: read

jobs:
  kickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch translation and CC queue workers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run soulkey_cc_queue.yml --ref main
          # CC worker recovery is separate; do not interfere with translation jobs.
          echo "SOULKEY_QUEUES_DISPATCH_REQUESTED"
          # Recovery: use verified Gemini 3.5 Flash-Lite; preserve P259 old drafts.
