name: SoulKey NVIDIA multilingual LLM backup smoke
on:
  push:
    branches:
      - test/nvidia-api-backup-smoke-20261031
    paths:
      - .github/workflows/nvidia_llm_translation_smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Verify NVIDIA free endpoint text model for Indonesian and Khmer
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, time, urllib.request, urllib.error
          key = os.getenv("NVIDIA_API_KEY", "").strip()
          if not key:
              print("NVIDIA_LLM_NO_KEY")
              raise SystemExit(3)
          model = "mistralai/mistral-nemotron"
          endpoint = "https://integrate.api.nvidia.com/v1/chat/completions"
          text = "A kind thought can become a helpful action."
          languages = {"id":"Indonesian (Bahasa Indonesia)","km":"Khmer (Cambodian)"}
          print("NVIDIA_LLM_START model={} targets=id,km isolated_no_drive".format(model), flush=True)
          passed = 0
          for code,name in languages.items():
              prompt = "Translate the following English sentence accurately into {}. Return only the translated sentence, with no explanation or extra commentary. Sentence: {}".format(name,text)
              body = {"model":model,"messages":[{"role":"user","content":prompt}],"temperature":0,"max_tokens":160,"stream":False}
              req = urllib.request.Request(endpoint, data=json.dumps(body).encode(),method="POST",headers={"Authorization":"Bearer "+key,"Content-Type":"application/json","Accept":"application/json"})
              start=time.monotonic()
              try:
                  with urllib.request.urlopen(req, timeout=55) as resp:
                      raw = resp.read().decode("utf-8")
                      status = resp.status
                  payload=json.loads(raw)
                  choices=payload.get("choices") or []
                  result=str((choices[0].get("message") or {}).get("content") or "").strip() if choices else ""
                  if status!=200 or not result or result.casefold()==text.casefold():
                      raise ValueError("EMPTY_OR_UNTRANSLATED")
                  passed+=1
                  print("NVIDIA_LLM_OK lang={} seconds={:.1f} translated={}".format(code,time.monotonic()-start,result.replace("\n"," ")[:220]),flush=True)
              except Exception as e:
                  s=str(e)
                  codeout= ("HTTP_"+str(e.code)) if isinstance(e,urllib.error.HTTPError) else ("TIMEOUT" if "timed out" in s.lower() else type(e).__name__)
                  print("NVIDIA_LLM_FAIL lang={} seconds={:.1f} reason={}".format(code,time.monotonic()-start,codeout),flush=True)
          print("NVIDIA_LLM_RESULT passed={}/2".format(passed),flush=True)
          raise SystemExit(0 if passed==2 else 1)
          PY
